name: temporary virtual portfolio identity PR applicator

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/virtual-portfolio-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/virtual-portfolio-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Apply patch
        run: python scripts/_apply_virtual_portfolio_identity.py
      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/trading_identity.py src/signals.py run_daily_cycle.py virtual_order.py \
            app.py database_backup.py src/database_backup.py \
            src/virtual_trade_integrity.py scripts/sqlite_backup_recovery_drill.ps1 \
            config.example.yaml README.md tests/test_database_backup_drill.py \
            tests/run_database_backup_drill_windows.ps1 \
            tests/test_virtual_portfolio_identity.py .github/workflows/tests.yml \
            pyrightconfig.json
          git commit -m "fix: separate signal strategy from virtual portfolio"
          git push origin HEAD:agent/virtual-portfolio-identity
