name: temporary virtual portfolio identity PR applicator

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/virtual-portfolio-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/virtual-portfolio-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Apply patch
        run: python scripts/_apply_virtual_portfolio_identity.py
      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- \
            scripts/_apply_virtual_portfolio_identity.py \
            scripts/_virtual_portfolio_apply_diagnostics.txt \
            scripts/_fix_virtual_portfolio_applicator.py \
            .github/workflows/_apply-virtual-portfolio-identity.yml \
            .github/workflows/_apply-virtual-portfolio-identity-pr.yml \
            .github/workflows/_diagnose-virtual-portfolio-applicator.yml \
            .github/workflows/_fix-virtual-portfolio-applicator.yml \
            docs/.virtual-portfolio-pr-placeholder \
            docs/.virtual-portfolio-pr-scope \
            docs/.virtual-portfolio-pr-ready \
            docs/.virtual-portfolio-pr-retry
          if [[ -z "$(git diff --cached --name-only)" ]]; then
            echo "No generated implementation changes"
            exit 1
          fi
          git commit -m "fix: separate signal strategy from virtual portfolio"
          git push origin HEAD:agent/virtual-portfolio-identity
