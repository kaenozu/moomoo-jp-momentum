name: Validate full review fixes

on:
  push:
    branches:
      - agent/fix-full-source-review
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-full-source-review
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q src tests run_daily_cycle.py scheduler.py

      - name: Test
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/ -m "not slow" -q 2>&1 | tee review-pytest.txt

      - name: Commit failure diagnostics
        if: steps.pytest.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-pytest.txt
          git commit -m "test: capture full review pytest diagnostics"
          git push origin HEAD:agent/fix-full-source-review
          exit 1

      - name: Remove transient diagnostics
        if: steps.pytest.outcome == 'success'
        run: rm -f review-pytest.txt

      - name: Lint
        if: steps.pytest.outcome == 'success'
        run: ruff check src tests run_daily_cycle.py scheduler.py

      - name: Type check
        if: steps.pytest.outcome == 'success'
        run: pyright

      - name: Commit diagnostic cleanup
        if: steps.pytest.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
          else
            git commit -m "chore: remove transient review diagnostics"
            git push origin HEAD:agent/fix-full-source-review
          fi
