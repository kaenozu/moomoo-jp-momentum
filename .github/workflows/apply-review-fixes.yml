name: Apply full review fixes

on:
  push:
    branches:
      - agent/fix-full-source-review
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-full-source-review
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply readable migrations
        run: |
          python scripts/fix_migration_helpers.py
          python scripts/apply_review_core.py
          python scripts/apply_review_storage.py
          python scripts/apply_review_pipeline.py
          python scripts/apply_review_tests.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q src tests run_daily_cycle.py scheduler.py

      - name: Test
        run: python -m pytest tests/ -m "not slow" -q

      - name: Lint
        run: ruff check src tests run_daily_cycle.py scheduler.py

      - name: Type check
        run: pyright

      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "fix: resolve full source review findings"
            git push origin HEAD:agent/fix-full-source-review
          fi
