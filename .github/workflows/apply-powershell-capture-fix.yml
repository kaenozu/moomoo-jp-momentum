name: apply PowerShell native capture fix

on:
  push:
    branches:
      - agent/sqlite-backup-recovery-drill

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sqlite-backup-recovery-drill
          fetch-depth: 0

      - name: Apply exact PowerShell 5 capture patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/run_database_backup_drill_windows.ps1")
          text = path.read_text(encoding="utf-8")
          old = '''    $raw = & $ShellExecutable -NoProfile -NonInteractive `
              -ExecutionPolicy Bypass @Arguments 2>&1
          $exitCode = $LASTEXITCODE
          return [pscustomobject]@{
              ExitCode = $exitCode
              Text = ($raw -join "`n")
          }
          '''
          new = '''    $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try {
              $raw = & $ShellExecutable -NoProfile -NonInteractive `
                  -ExecutionPolicy Bypass @Arguments 2>&1
              $exitCode = $LASTEXITCODE
          } finally {
              $ErrorActionPreference = $previousErrorActionPreference
          }
          return [pscustomobject]@{
              ExitCode = $exitCode
              Text = ($raw -join "`n")
          }
          '''
          if new in text:
              print("PowerShell capture fix is already present")
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit(f"expected one capture target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check
          pwsh -NoProfile -Command '
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              "tests/run_database_backup_drill_windows.ps1",
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          '

      - name: Commit exact fix
        run: |
          if git diff --quiet -- tests/run_database_backup_drill_windows.ps1; then
            echo "No harness change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/run_database_backup_drill_windows.ps1
          git commit -m "test: capture expected native failures on PowerShell 5"
          git push origin HEAD:agent/sqlite-backup-recovery-drill
