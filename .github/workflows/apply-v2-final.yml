name: apply-v2-final

on:
  pull_request:
    branches:
      - agent/fix-full-source-review

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-execution-reproducibility
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply correction with diagnostics
        run: |
          set +e
          python scripts/apply_v2_round_trip_fix.py > /tmp/v2_correction.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/v2_correction.log
          if [ "$STATUS" -ne 0 ]; then
            cp /tmp/v2_correction.log V2_FINAL_FAILURE.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add V2_FINAL_FAILURE.txt
            git commit -m 'chore: capture final v2 correction failure'
            git push origin HEAD:agent/v2-execution-reproducibility
            exit "$STATUS"
          fi

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate correction
        run: |
          : > /tmp/v2_validation.log
          STATUS=0
          python -m pytest tests/ -m "not slow" -q >> /tmp/v2_validation.log 2>&1 || STATUS=$?
          ruff check --output-format=github src/ tests/ run_daily_cycle.py >> /tmp/v2_validation.log 2>&1 || STATUS=$?
          pyright >> /tmp/v2_validation.log 2>&1 || STATUS=$?
          python run_daily_cycle.py --dry-run --config tests/fixtures/config.test.yaml >> /tmp/v2_validation.log 2>&1 || STATUS=$?
          cat /tmp/v2_validation.log
          if [ "$STATUS" -ne 0 ]; then
            cp /tmp/v2_validation.log V2_FINAL_FAILURE.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src tests V2_FINAL_FAILURE.txt
            git commit -m 'chore: capture final v2 validation failure'
            git push origin HEAD:agent/v2-execution-reproducibility
            exit "$STATUS"
          fi

      - name: Remove temporary assets and commit
        run: |
          rm scripts/apply_v2_round_trip_fix.py
          rm .github/workflows/apply-v2-final.yml
          rm -f V2_FINAL_FAILURE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: validate shared execution round trip'
          git push origin HEAD:agent/v2-execution-reproducibility
