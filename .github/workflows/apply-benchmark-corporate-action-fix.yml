name: Apply benchmark corporate-action fix

on:
  push:
    branches:
      - agent/benchmark-corporate-action-fix
    paths:
      - scripts/_apply_benchmark_corporate_action_fix.py
      - .github/workflows/apply-benchmark-corporate-action-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/benchmark-corporate-action-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml pandas
      - name: Apply source changes
        run: python scripts/_apply_benchmark_corporate_action_fix.py
      - name: Compile changed Python sources
        run: >-
          python -m compileall -q
          src/benchmarking.py
          src/backtest_runner.py
          src/benchmark.py
          src/backtest_evaluation.py
          src/walk_forward_validation.py
          validated_backtest.py
          historical_backtest.py
          scripts/rerun_p2_benchmarks.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_benchmarking.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct benchmark roles and split adjustment"
          git push origin HEAD:agent/benchmark-corporate-action-fix
