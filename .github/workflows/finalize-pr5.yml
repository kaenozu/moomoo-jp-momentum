name: finalize PR5

on:
  push:
    branches:
      - fix/virtual-trade-cash-reservation
    paths:
      - finalize-pr5.trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/virtual-trade-cash-reservation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply final corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          virtual_path = Path("src/virtual_trade.py")
          virtual = virtual_path.read_text(encoding="utf-8")
          old = "if current_quantity + quantity > self.max_position_per_symbol:"
          new = "if current_quantity >= self.max_position_per_symbol:"
          if virtual.count(old) != 1:
              raise RuntimeError(f"expected one position-limit expression, found {virtual.count(old)}")
          virtual_path.write_text(virtual.replace(old, new), encoding="utf-8")

          core_path = Path("tests/test_core.py")
          core = core_path.read_text(encoding="utf-8")
          core_path.write_text(core.replace("import pytest\n", "", 1), encoding="utf-8")
          PY

          rm -f PR5_REBUILD_STATUS.md finalize-pr5.trigger .github/workflows/finalize-pr5.yml

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -q

      - name: Run ruff
        run: >-
          ruff check src/ tests/ run_daily_cycle.py daily_update.py
          historical_backtest.py screen_candidates.py scheduler.py
          performance_report.py --output-format=github

      - name: Run pyright
        run: pyright

      - name: Run dry-run
        run: >-
          python run_daily_cycle.py --dry-run
          --config tests/fixtures/config.test.yaml

      - name: Verify no runtime artifacts
        run: |
          test ! -e data/moomoo.db
          test ! -d logs
          test ! -d reports

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize virtual order reservation lifecycle"
          git push origin HEAD:fix/virtual-trade-cash-reservation
