name: debug-pr54

on:
  pull_request:

jobs:
  pytest-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Capture pytest output
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -m "not slow" -q --tb=short > pytest-output.txt 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
      - name: Preserve pytest status
        shell: bash
        run: exit "${{ steps.pytest.outputs.status }}"
