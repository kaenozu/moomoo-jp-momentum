name: temporary update virtual portfolio regression

on:
  push:
    branches:
      - agent/virtual-portfolio-identity
    paths:
      - scripts/_update_virtual_portfolio_regression.py
      - .github/workflows/_update-virtual-portfolio-regression.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/virtual-portfolio-identity
          fetch-depth: 0
      - name: Update and commit regression
        run: |
          python scripts/_update_virtual_portfolio_regression.py
          python -m py_compile tests/test_regressions.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_regressions.py
          git commit -m "test: expect virtual portfolio in dry-run result"
          git push origin HEAD:agent/virtual-portfolio-identity
