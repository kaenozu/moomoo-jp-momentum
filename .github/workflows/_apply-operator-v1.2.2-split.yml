name: apply operator v1.2.2 split

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/_apply_operator_v1_2_2_split.py
      - .github/workflows/_apply-operator-v1.2.2-split.yml
  push:
    branches:
      - agent/operator-v1.2.2-windows-hardening
    paths:
      - scripts/_apply_operator_v1_2_2_split.py
      - .github/workflows/_apply-operator-v1.2.2-split.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/operator-v1.2.2-windows-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-v1.2.2-windows-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply split and push
        run: python scripts/_apply_operator_v1_2_2_split.py
