name: Sync Coordinator Issue

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Coordinator issue number (default: vars.COORDINATOR_ISSUE or 77)
        required: false
        type: number
      write:
        description: Write the generated section to the issue (false = dry-run)
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Sync Coordinator issue PR/merge section
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || vars.COORDINATOR_ISSUE || 77 }}
          WRITE_MODE: ${{ inputs.write == true || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --issue-number "$ISSUE_NUMBER")
          if [[ "$WRITE_MODE" == "true" ]]; then
            args+=(--write)
          fi
          python3 scripts/sync_coordinator_issue.py "${args[@]}"
