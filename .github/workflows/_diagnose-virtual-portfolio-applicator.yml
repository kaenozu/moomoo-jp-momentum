name: temporary diagnose virtual portfolio applicator

on:
  push:
    branches:
      - agent/virtual-portfolio-identity
    paths:
      - .github/workflows/_diagnose-virtual-portfolio-applicator.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/virtual-portfolio-identity
          fetch-depth: 0
      - name: Run applicator and retain exact failure
        shell: bash
        run: |
          set +e
          python scripts/_apply_virtual_portfolio_identity.py > "$RUNNER_TEMP/apply.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/apply.log"
          if [[ $code -eq 0 ]]; then
            echo "Applicator unexpectedly succeeded; use the validation workflow"
            exit 1
          fi
          git reset --hard HEAD
          git clean -fd
          cp "$RUNNER_TEMP/apply.log" scripts/_virtual_portfolio_apply_diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/_virtual_portfolio_apply_diagnostics.txt
          git commit -m "chore: record portfolio applicator failure"
          git push origin HEAD:agent/virtual-portfolio-identity
