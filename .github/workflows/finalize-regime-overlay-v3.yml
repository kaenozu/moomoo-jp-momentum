name: finalize regime overlay implementation v3

on:
  pull_request:
    types:
      - opened

permissions:
  contents: write

jobs:
  finalize:
    if: startsWith(github.event.pull_request.head.ref, 'agent/regime-overlay-finalize-v3')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path


          def find_line(lines: list[str], value: str, start: int = 0) -> int:
              for index in range(start, len(lines)):
                  if lines[index] == value:
                      return index
              raise RuntimeError(f"line not found: {value!r}")


          runner_path = Path("src/backtest_runner.py")
          runner = runner_path.read_text(encoding="utf-8").splitlines()

          import_line = "from .regime_detector import RegimeDetector, RegimeRecord"
          if import_line not in runner:
              index = find_line(runner, "from .ranking import sort_items_by_score")
              runner.insert(index + 1, import_line)

          init_line = "        self.regime_detector = RegimeDetector(config)"
          if init_line not in runner:
              index = find_line(
                  runner,
                  "        self.split_adjustments = SplitAdjustmentService(self.db_path)",
              )
              runner.insert(index + 1, init_line)

          method_line = "    def _ensure_market_regime_column(self) -> None:"
          if method_line not in runner:
              index = find_line(runner, "    def _conn(self):")
              runner[index:index] = [
                  method_line,
                  '        """既存DBのequity curveへmarket_regime列を追加する。"""',
                  "        with self._conn() as conn:",
                  "            table = conn.execute(",
                  '                "SELECT 1 FROM sqlite_master "',
                  '                "WHERE type=\'table\' AND name=\'backtest_equity_curve\'"',
                  "            ).fetchone()",
                  "            if table is None:",
                  "                return",
                  "            columns = {",
                  "                row[1]",
                  "                for row in conn.execute(",
                  '                    "PRAGMA table_info(backtest_equity_curve)"',
                  "                ).fetchall()",
                  "            }",
                  '            if "market_regime" not in columns:',
                  "                conn.execute(",
                  '                    "ALTER TABLE backtest_equity_curve "',
                  '                    "ADD COLUMN market_regime TEXT"',
                  "                )",
                  "",
              ]

          ensure_call = "        self._ensure_market_regime_column()"
          if ensure_call not in runner:
              index = find_line(
                  runner,
                  "        run_id = self.create_run(strategy_name, start_date, end_date)",
              )
              runner.insert(index, ensure_call)

          regimes_line = "        regimes: list[RegimeRecord] = []"
          if regimes_line not in runner:
              index = find_line(runner, "        idle_bench_prev = None")
              runner[index + 1:index + 1] = [
                  regimes_line,
                  "        if idle_code and self.regime_detector.enabled:",
                  "            history_limit = max(",
                  "                250,",
                  "                len(days) + self.regime_detector.long_window + 1,",
                  "            )",
                  "            regime_df = self._bars_up_to(",
                  "                self.regime_detector.signal_code,",
                  "                end_date,",
                  "                limit=history_limit,",
                  "            )",
                  "            if not regime_df.empty:",
                  '                regime_df = regime_df.rename(columns={"time_key": "date"})',
                  "                regimes = self.regime_detector.detect(",
                  '                    regime_df[["date", "close"]]',
                  "                )",
                  "            if not regimes:",
                  "                logger.warning(",
                  '                    "regime signal data missing: code=%s; "',
                  '                    "idle cash overlay stays inactive",',
                  "                    self.regime_detector.signal_code,",
                  "                )",
              ]

          phase4_start = find_line(
              runner,
              "            # ── Phase 4: idle cash allocation ──",
          )
          phase5_start = find_line(
              runner,
              "            # ── Phase 5: equity curve更新 ──",
              phase4_start,
          )
          if not any(
              "market_regime =" in line
              for line in runner[phase4_start:phase5_start]
          ):
              runner[phase4_start:phase5_start] = [
                  "            # ── Phase 4: idle cash allocation ──",
                  "            market_regime = (",
                  "                self.regime_detector.regime_on(day, regimes)",
                  "                if regimes",
                  "                else None",
                  "            )",
                  "            if idle_code:",
                  "                bm_today = self._benchmark_value(idle_code, day)",
                  "                overlay_active = (",
                  "                    not self.regime_detector.enabled",
                  "                    or self.regime_detector.is_overlay_active(market_regime)",
                  "                )",
                  "                if (",
                  "                    overlay_active",
                  "                    and bm_today is not None",
                  "                    and idle_bench_prev is not None",
                  "                    and idle_bench_prev != 0",
                  "                ):",
                  "                    daily_bm_ret = (",
                  "                        (bm_today - idle_bench_prev) / idle_bench_prev",
                  "                    )",
                  "                    investable_idle_cash = max(",
                  "                        0.0,",
                  "                        self.cash - self.reserved_cash,",
                  "                    )",
                  "                    self.cash += investable_idle_cash * daily_bm_ret",
                  "                idle_bench_prev = bm_today",
                  "",
              ]

          old_insert = next(
              (
                  index
                  for index, line in enumerate(runner)
                  if "INSERT OR REPLACE INTO backtest_equity_curve" in line
                  and "market_regime" not in line
              ),
              None,
          )
          if old_insert is not None:
              start = old_insert - 1
              runner[start:old_insert + 3] = [
                  "                conn.execute(",
                  '                    "INSERT OR REPLACE INTO backtest_equity_curve "',
                  '                    "(run_id, strategy_name, date, cash, position_value, "',
                  '                    "total_equity, benchmark_2559_value, "',
                  '                    "benchmark_1306_value, drawdown_pct, market_regime) "',
                  '                    "VALUES (?,?,?,?,?,?,?,?,?,?)",',
                  "                    (",
                  "                        self.run_id,",
                  "                        strategy_name,",
                  "                        day,",
                  "                        self.cash,",
                  "                        pos_value,",
                  "                        total_equity,",
                  "                        bm_2559,",
                  "                        bm_1306,",
                  "                        drawdown,",
                  "                        market_regime,",
                  "                    ),",
                  "                )",
              ]

          runner_path.write_text("\n".join(runner) + "\n", encoding="utf-8")

          models_path = Path("src/models.py")
          models = models_path.read_text(encoding="utf-8").splitlines()
          table_start = find_line(
              models,
              "CREATE TABLE IF NOT EXISTS backtest_equity_curve (",
          )
          drawdown_index = find_line(models, "    drawdown_pct REAL,", table_start)
          if models[drawdown_index + 1] != "    market_regime TEXT,":
              models.insert(drawdown_index + 1, "    market_regime TEXT,")
          models_path.write_text("\n".join(models) + "\n", encoding="utf-8")

          store_path = Path("src/data_store.py")
          store = store_path.read_text(encoding="utf-8").splitlines()
          migration_line = '        add_missing("backtest_equity_curve", {'
          if migration_line not in store:
              signals_start = find_line(store, '        add_missing("signals", {')
              signals_end = find_line(store, "        })", signals_start)
              store[signals_end + 1:signals_end + 1] = [
                  migration_line,
                  '            "market_regime": "TEXT",',
                  "        })",
              ]
          store_path.write_text("\n".join(store) + "\n", encoding="utf-8")

          for workflow in (
              ".github/workflows/apply-regime-overlay.yml",
              ".github/workflows/trigger-regime-overlay.yml",
              ".github/workflows/finalize-regime-overlay.yml",
              ".github/workflows/finalize-regime-overlay-v2.yml",
              ".github/workflows/finalize-regime-overlay-v3.yml",
          ):
              path = Path(workflow)
              if path.exists():
                  path.unlink()
          PY

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate implementation
        run: |
          python -m pytest tests/test_regime_detector.py -q
          python -m pytest tests/ -m "not slow" -q
          ruff check src/backtest_runner.py src/regime_detector.py src/models.py src/data_store.py tests/test_regime_detector.py
          pyright src/backtest_runner.py src/regime_detector.py tests/test_regime_detector.py
          git diff --check

      - name: Record full pyright baseline
        continue-on-error: true
        run: pyright

      - name: Commit and push to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backtest_runner.py src/regime_detector.py src/models.py src/data_store.py tests/test_regime_detector.py .github/workflows/apply-regime-overlay.yml .github/workflows/trigger-regime-overlay.yml .github/workflows/finalize-regime-overlay.yml .github/workflows/finalize-regime-overlay-v2.yml .github/workflows/finalize-regime-overlay-v3.yml
          git commit -m "feat: add regime-aware idle cash overlay"
          git push origin HEAD:master
