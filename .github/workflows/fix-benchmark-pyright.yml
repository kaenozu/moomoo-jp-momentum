name: Resolve benchmark Pyright diagnostics

on:
  push:
    branches:
      - agent/benchmark-corporate-action-fix
    paths:
      - .github/workflows/fix-benchmark-pyright.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/benchmark-corporate-action-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix run identifier narrowing
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/backtest_runner.py")
          text = path.read_text(encoding="utf-8")
          old = "run_id=int(self.run_id),"
          if text.count(old) != 2:
              raise SystemExit(f"unexpected run_id narrowing count: {text.count(old)}")
          path.write_text(
              text.replace(old, "run_id=run_id,"),
              encoding="utf-8",
              newline="\n",
          )
          Path(".github/workflows/fix-benchmark-pyright.yml").unlink()
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Validate type checking and focused tests
        run: |
          pyright
          python -m pytest -q tests/test_benchmarking.py
      - name: Commit type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: narrow benchmark run identifier"
          git push origin HEAD:agent/benchmark-corporate-action-fix
