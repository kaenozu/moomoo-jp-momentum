name: apply final recovery review fixes

on:
  push:
    branches:
      - agent/sqlite-backup-recovery-drill

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sqlite-backup-recovery-drill
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply deterministic review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/sqlite_backup_recovery_drill.ps1",
              '''$RepoRoot = Get-NormalizedPath (Get-Location).Path
          $ProductionConfig = (Resolve-Path $ProductionConfig).Path
          $EvidenceDir = Get-NormalizedPath $EvidenceDir
          $SecondaryDir = Get-NormalizedPath $SecondaryDir
          $RestorePath = Get-NormalizedPath $RestorePath
          ''',
              '''$InvocationDirectory = Get-NormalizedPath (Get-Location).Path
          $repoRootRaw = & git -C $PSScriptRoot rev-parse --show-toplevel 2>&1
          $repoRootExit = $LASTEXITCODE
          if ($repoRootExit -ne 0) { throw ($repoRootRaw -join "`n") }
          $RepoRoot = Get-NormalizedPath (($repoRootRaw -join "").Trim())

          if ([IO.Path]::IsPathRooted($ProductionConfig)) {
              $ProductionConfig = (Resolve-Path $ProductionConfig).Path
          } else {
              $ProductionConfig = (
                  Resolve-Path (Join-Path $RepoRoot $ProductionConfig)
              ).Path
          }
          if (-not [IO.Path]::IsPathRooted($EvidenceDir)) {
              $EvidenceDir = Join-Path $InvocationDirectory $EvidenceDir
          }
          if (-not [IO.Path]::IsPathRooted($SecondaryDir)) {
              $SecondaryDir = Join-Path $InvocationDirectory $SecondaryDir
          }
          if (-not [IO.Path]::IsPathRooted($RestorePath)) {
              $RestorePath = Join-Path $InvocationDirectory $RestorePath
          }
          $EvidenceDir = Get-NormalizedPath $EvidenceDir
          $SecondaryDir = Get-NormalizedPath $SecondaryDir
          $RestorePath = Get-NormalizedPath $RestorePath
          Set-Location -LiteralPath $RepoRoot
          ''',
          )
          replace_once(
              "scripts/sqlite_backup_recovery_drill.ps1",
              '$headRaw = & git rev-parse HEAD 2>&1',
              '$headRaw = & git -C $RepoRoot rev-parse HEAD 2>&1',
          )
          replace_once(
              "scripts/sqlite_backup_recovery_drill.ps1",
              '$statusRaw = & git status --porcelain 2>&1',
              '$statusRaw = & git -C $RepoRoot status --porcelain 2>&1',
          )

          replace_once(
              "tests/run_database_backup_drill_windows.ps1",
              '''function Invoke-DrillProcess {
              param(
                  [Parameter(Mandatory = $true)]
                  [string[]]$Arguments
              )

              $previousErrorActionPreference = $ErrorActionPreference
              $ErrorActionPreference = "Continue"
              try {
                  $raw = & $ShellExecutable -NoProfile -NonInteractive `
                      -ExecutionPolicy Bypass @Arguments 2>&1
                  $exitCode = $LASTEXITCODE
              } finally {
                  $ErrorActionPreference = $previousErrorActionPreference
              }
              return [pscustomobject]@{
                  ExitCode = $exitCode
                  Text = ($raw -join "`n")
              }
          }
          ''',
              '''function Invoke-DrillProcess {
              param(
                  [Parameter(Mandatory = $true)]
                  [string[]]$Arguments,
                  [string]$WorkingDirectory
              )

              $previousErrorActionPreference = $ErrorActionPreference
              $locationPushed = $false
              $raw = @()
              $exitCode = $null
              try {
                  if ($WorkingDirectory) {
                      Push-Location -LiteralPath $WorkingDirectory
                      $locationPushed = $true
                  }
                  $ErrorActionPreference = "Continue"
                  $raw = & $ShellExecutable -NoProfile -NonInteractive `
                      -ExecutionPolicy Bypass @Arguments 2>&1
                  $exitCode = $LASTEXITCODE
              } finally {
                  $ErrorActionPreference = $previousErrorActionPreference
                  if ($locationPushed) {
                      Pop-Location
                  }
              }
              return [pscustomobject]@{
                  ExitCode = $exitCode
                  Text = ($raw -join "`n")
              }
          }
          ''',
          )
          replace_once(
              "tests/run_database_backup_drill_windows.ps1",
              '''$BaseArguments = @(
              "-File", $DrillScript,
              "-ExpectedHead", $HeadSha,
              "-ProductionConfig", $Config,
              "-Strategy", "momentum"
          )
          ''',
              '''$BaseArguments = @(
              "-File", $DrillScript,
              "-ExpectedHead", $HeadSha,
              "-ProductionConfig", $Config,
              "-Strategy", "momentum"
          )
          $RepoSubdirectory = Join-Path $RepoRoot "tests"
          ''',
          )
          replace_once(
              "tests/run_database_backup_drill_windows.ps1",
              '''if (Test-Path -LiteralPath $RepoEvidence) {
              throw "repository-path guard created evidence inside the repository"
          }

          # Preflight must be read-only and create no requested output paths.
          ''',
              '''if (Test-Path -LiteralPath $RepoEvidence) {
              throw "repository-path guard created evidence inside the repository"
          }

          # Repository containment must still be enforced when invoked from a subdirectory.
          $SubdirRepoEvidence = Join-Path $RepoRoot "temporary subdir recovery evidence"
          $subdirRepoPathResult = Invoke-DrillProcess -Arguments @(
              $BaseArguments + @(
                  "-EvidenceDir", $SubdirRepoEvidence,
                  "-SecondaryDir", (Join-Path $Root "subdir repo guard secondary"),
                  "-RestorePath", (Join-Path $Root "subdir repo guard restore\\restored.db"),
                  "-PreflightOnly"
              )
          ) -WorkingDirectory $RepoSubdirectory
          Assert-Failure $subdirRepoPathResult "subdirectory repository-path guard"
          if (Test-Path -LiteralPath $SubdirRepoEvidence) {
              throw "subdirectory repository-path guard created evidence inside the repository"
          }

          # Preflight must be read-only and create no requested output paths.
          ''',
          )
          replace_once(
              "tests/run_database_backup_drill_windows.ps1",
              '''$preflightResult = Invoke-DrillProcess -Arguments @(
              $BaseArguments + @(
                  "-EvidenceDir", $PreflightEvidence,
                  "-SecondaryDir", $PreflightSecondary,
                  "-RestorePath", $PreflightRestore,
                  "-PreflightOnly"
              )
          )
          ''',
              '''$preflightResult = Invoke-DrillProcess -Arguments @(
              $BaseArguments + @(
                  "-EvidenceDir", $PreflightEvidence,
                  "-SecondaryDir", $PreflightSecondary,
                  "-RestorePath", $PreflightRestore,
                  "-PreflightOnly"
              )
          ) -WorkingDirectory $RepoSubdirectory
          ''',
          )
          replace_once(
              "tests/run_database_backup_drill_windows.ps1",
              '''    repository_path_rejected = $true
              existing_restore_rejected = $true
          ''',
              '''    repository_path_rejected = $true
              subdirectory_invocation_validated = $true
              existing_restore_rejected = $true
          ''',
          )

          replace_once(
              ".github/workflows/windows-recovery-drill.yml",
              'on: [push, pull_request]',
              '''on:
            pull_request:
            push:
              branches:
                - master''',
          )

          replace_once(
              "docs/sqlite-backup-recovery-drill.md",
              '''The script requires an exact approved Git SHA and rejects a dirty working tree. It also rejects evidence, secondary, and restore paths inside the repository.
          ''',
              '''The script requires an exact approved Git SHA and rejects a dirty working tree. It resolves the real checkout root from its own script location with `git rev-parse --show-toplevel`, so repository-containment checks do not depend on the operator's current directory. Relative production-config paths are resolved from that checkout root; relative evidence, secondary, and restore paths are resolved from the invocation directory. It rejects evidence, secondary, and restore paths anywhere inside the repository.
          ''',
          )
          PY

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Validate focused tests and PowerShell syntax
        run: |
          python -m pytest tests/test_virtual_trade_integrity_connection.py tests/test_database_backup_drill.py -q
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/sqlite_backup_recovery_drill.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tests/run_database_backup_drill_windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'

      - name: Commit fixes and remove one-time workflow
        run: |
          git rm .github/workflows/apply-final-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sqlite_backup_recovery_drill.ps1 tests/run_database_backup_drill_windows.ps1 .github/workflows/windows-recovery-drill.yml docs/sqlite-backup-recovery-drill.md
          git commit -m "fix: anchor recovery drill to repository root"
          git push origin HEAD:agent/sqlite-backup-recovery-drill
