name: apply quote type fix

on:
  push:
    branches:
      - agent/daily-beta-counterfactual-analysis

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-beta-counterfactual-analysis
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply scalar normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/quote_service.py")
          text = path.read_text(encoding="utf-8")
          if "def _scalar_value(" not in text:
              text = text.replace(
                  "from typing import Optional, cast",
                  "from typing import Any, Optional, cast",
                  1,
              )
              marker = "BATCH_SLEEP_SECONDS = 1.0\n\n\n"
              helper = '''BATCH_SLEEP_SECONDS = 1.0


def _scalar_value(value: Any) -> Any:
    """pandas行アクセス結果を単一値へ正規化する。"""
    if isinstance(value, pd.Series):
        if len(value) != 1:
            raise ValueError("単一値を期待しました")
        return value.iloc[0]
    if pd.api.types.is_scalar(value):
        return value
    try:
        if len(value) == 1:
            return value[0]
    except (TypeError, KeyError, IndexError):
        pass
    raise TypeError("単一値へ変換できません")


'''
              if marker not in text:
                  raise RuntimeError("quote service helper marker not found")
              text = text.replace(marker, helper, 1)
              old = '''                open_price = float(row["open"])
                high_price = float(row["high"])
                low_price = float(row["low"])
                close_price = float(row["close"])
                volume = int(row["volume"]) if pd.notna(row["volume"]) else 0
'''
              new = '''                open_price = float(_scalar_value(row["open"]))
                high_price = float(_scalar_value(row["high"]))
                low_price = float(_scalar_value(row["low"]))
                close_price = float(_scalar_value(row["close"]))
                volume_value = _scalar_value(row["volume"])
                volume = int(volume_value) if pd.notna(volume_value) else 0
'''
              if old not in text:
                  raise RuntimeError("quote service conversion block not found")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate patch
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          python -m pytest -q tests/test_daily_cycle_yfinance.py
          ruff check src/quote_service.py tests/test_daily_cycle_yfinance.py
          pyright

      - name: Commit and push patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quote_service.py
          git commit -m "fix: normalize yfinance row scalars"
          git push origin HEAD:agent/daily-beta-counterfactual-analysis
