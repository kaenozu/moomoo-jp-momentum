name: finalize regime overlay implementation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: startsWith(github.event.pull_request.head.ref, 'agent/regime-overlay-finalize')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply remaining implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap


          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              old = textwrap.dedent(old)
              new = textwrap.dedent(new)
              if old not in text:
                  raise RuntimeError(f"patch marker not found: {path}: {old[:100]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")


          replace_once(
              "src/backtest_runner.py",
              "from .ranking import sort_items_by_score\n",
              "from .ranking import sort_items_by_score\n"
              "from .regime_detector import RegimeDetector, RegimeRecord\n",
          )

          replace_once(
              "src/backtest_runner.py",
              "        self.split_adjustments = SplitAdjustmentService(self.db_path)\n"
              "        self.run_id: Optional[int] = None\n",
              "        self.split_adjustments = SplitAdjustmentService(self.db_path)\n"
              "        self.regime_detector = RegimeDetector(config)\n"
              "        self.run_id: Optional[int] = None\n",
          )

          replace_once(
              "src/backtest_runner.py",
              '''    def _idle_cash_benchmark_code(self) -> Optional[str]:
                  cfg = self.config.get("backtest.idle_cash_allocation", {})
                  if cfg.get("enabled", False):
                      return cfg.get("benchmark_code", self._benchmark_code())
                  return None

              def _conn(self):
          ''',
              '''    def _idle_cash_benchmark_code(self) -> Optional[str]:
                  cfg = self.config.get("backtest.idle_cash_allocation", {})
                  if cfg.get("enabled", False):
                      return cfg.get("benchmark_code", self._benchmark_code())
                  return None

              def _ensure_market_regime_column(self) -> None:
                  """既存DBのequity curveへmarket_regime列を追加する。"""
                  with self._conn() as conn:
                      table = conn.execute(
                          "SELECT 1 FROM sqlite_master "
                          "WHERE type='table' AND name='backtest_equity_curve'"
                      ).fetchone()
                      if table is None:
                          return
                      columns = {
                          row[1]
                          for row in conn.execute(
                              "PRAGMA table_info(backtest_equity_curve)"
                          ).fetchall()
                      }
                      if "market_regime" not in columns:
                          conn.execute(
                              "ALTER TABLE backtest_equity_curve "
                              "ADD COLUMN market_regime TEXT"
                          )

              def _conn(self):
          ''',
          )

          replace_once(
              "src/backtest_runner.py",
              '''        self.strategy_name = strategy_name
                  self.cash = self.initial_cash
                  self.reserved_cash = 0.0  # pending BUY予約額（signal日で増加、fill日で解放）
                  run_id = self.create_run(strategy_name, start_date, end_date)
          ''',
              '''        self.strategy_name = strategy_name
                  self.cash = self.initial_cash
                  self.reserved_cash = 0.0  # pending BUY予約額（signal日で増加、fill日で解放）
                  self._ensure_market_regime_column()
                  run_id = self.create_run(strategy_name, start_date, end_date)
          ''',
          )

          replace_once(
              "src/backtest_runner.py",
              '''        # Idle cash allocation tracking
                  idle_code = self._idle_cash_benchmark_code()
                  idle_bench_prev = None
          ''',
              '''        # Idle cash allocation tracking
                  idle_code = self._idle_cash_benchmark_code()
                  idle_bench_prev = None
                  regimes: list[RegimeRecord] = []
                  if idle_code and self.regime_detector.enabled:
                      history_limit = max(
                          250,
                          len(days) + self.regime_detector.long_window + 1,
                      )
                      regime_df = self._bars_up_to(
                          self.regime_detector.signal_code,
                          end_date,
                          limit=history_limit,
                      )
                      if not regime_df.empty:
                          regime_df = regime_df.rename(columns={"time_key": "date"})
                          regimes = self.regime_detector.detect(
                              regime_df[["date", "close"]]
                          )
                      if not regimes:
                          logger.warning(
                              "regime signal data missing: code=%s; "
                              "idle cash overlay stays inactive",
                              self.regime_detector.signal_code,
                          )
          ''',
          )

          replace_once(
              "src/backtest_runner.py",
              '''            # ── Phase 4: idle cash allocation ──
                      if idle_code:
                          bm_today = self._benchmark_value(idle_code, day)
                          if bm_today is not None and idle_bench_prev is not None:
                              daily_bm_ret = (bm_today - idle_bench_prev) / idle_bench_prev
                              investable_idle_cash = max(0.0, self.cash - self.reserved_cash)
                              self.cash += investable_idle_cash * daily_bm_ret
                          idle_bench_prev = bm_today
          ''',
              '''            # ── Phase 4: idle cash allocation ──
                      market_regime = (
                          self.regime_detector.regime_on(day, regimes)
                          if regimes
                          else None
                      )
                      if idle_code:
                          bm_today = self._benchmark_value(idle_code, day)
                          overlay_active = (
                              not self.regime_detector.enabled
                              or self.regime_detector.is_overlay_active(market_regime)
                          )
                          if (
                              overlay_active
                              and bm_today is not None
                              and idle_bench_prev is not None
                              and idle_bench_prev != 0
                          ):
                              daily_bm_ret = (
                                  (bm_today - idle_bench_prev) / idle_bench_prev
                              )
                              investable_idle_cash = max(
                                  0.0,
                                  self.cash - self.reserved_cash,
                              )
                              self.cash += investable_idle_cash * daily_bm_ret
                          idle_bench_prev = bm_today
          ''',
          )

          replace_once(
              "src/backtest_runner.py",
              '''                conn.execute(
                              "INSERT OR REPLACE INTO backtest_equity_curve (run_id, strategy_name, date, cash, position_value, total_equity, benchmark_2559_value, benchmark_1306_value, drawdown_pct) VALUES (?,?,?,?,?,?,?,?,?)",
                              (self.run_id, strategy_name, day, self.cash, pos_value, total_equity, bm_2559, bm_1306, drawdown),
                          )
          ''',
              '''                conn.execute(
                              "INSERT OR REPLACE INTO backtest_equity_curve "
                              "(run_id, strategy_name, date, cash, position_value, "
                              "total_equity, benchmark_2559_value, "
                              "benchmark_1306_value, drawdown_pct, market_regime) "
                              "VALUES (?,?,?,?,?,?,?,?,?,?)",
                              (
                                  self.run_id,
                                  strategy_name,
                                  day,
                                  self.cash,
                                  pos_value,
                                  total_equity,
                                  bm_2559,
                                  bm_1306,
                                  drawdown,
                                  market_regime,
                              ),
                          )
          ''',
          )

          replace_once(
              "src/models.py",
              '''    benchmark_1306_value REAL,
              drawdown_pct REAL,
              UNIQUE(run_id, strategy_name, date)
          ''',
              '''    benchmark_1306_value REAL,
              drawdown_pct REAL,
              market_regime TEXT,
              UNIQUE(run_id, strategy_name, date)
          ''',
          )

          replace_once(
              "src/data_store.py",
              '''        add_missing("signals", {
                  "strategy_name": "TEXT NOT NULL DEFAULT 'momentum'",
              })

              def _migrate_signals_unique_key(self, conn: sqlite3.Connection) -> None:
          ''',
              '''        add_missing("signals", {
                  "strategy_name": "TEXT NOT NULL DEFAULT 'momentum'",
              })
              add_missing("backtest_equity_curve", {
                  "market_regime": "TEXT",
              })

              def _migrate_signals_unique_key(self, conn: sqlite3.Connection) -> None:
          ''',
          )

          Path("tests/test_regime_detector.py").write_text(
              textwrap.dedent(
                  '''"""
              相場レジーム検出器の回帰テスト。

              ファイルパス: tests/test_regime_detector.py
              何をするか: bull/bear/range判定、1日遅延、設定による有効化を検証する
              なぜ存在するか: 先読みや後方互換性の回帰を防ぐため
              関連ファイル: src/regime_detector.py, src/backtest_runner.py
              """

              from pathlib import Path
              from typing import Any

              import pandas as pd
              import pytest
              import yaml

              from src.config import Config
              from src.regime_detector import RegimeDetector


              def _config(
                  tmp_path: Path,
                  regime: dict[str, Any] | None = None,
              ) -> Config:
                  config_path = tmp_path / "config.yaml"
                  config_path.write_text(
                      yaml.safe_dump(
                          {
                              "backtest": {
                                  "idle_cash_allocation": {
                                      "regime": regime or {},
                                  }
                              }
                          },
                          allow_unicode=True,
                          sort_keys=False,
                      ),
                      encoding="utf-8",
                  )
                  return Config(str(config_path))


              def _prices() -> pd.DataFrame:
                  return pd.DataFrame(
                      {
                          "date": pd.date_range(
                              "2026-01-01",
                              periods=6,
                              freq="D",
                          ),
                          "close": [10.0, 11.0, 12.0, 8.0, 10.0, 13.0],
                      }
                  )


              def test_detects_unknown_bull_bear_and_range(
                  tmp_path: Path,
              ) -> None:
                  detector = RegimeDetector(
                      _config(
                          tmp_path,
                          {
                              "enabled": True,
                              "short_window": 2,
                              "long_window": 3,
                          },
                      )
                  )

                  regimes = detector.detect(_prices())

                  assert [item["regime"] for item in regimes] == [
                      "unknown",
                      "unknown",
                      "bull",
                      "bear",
                      "range",
                      "bull",
                  ]
                  assert regimes[2]["sma50"] == 11.5
                  assert regimes[2]["sma200"] == 11.0


              def test_regime_on_uses_previous_day_to_prevent_lookahead(
                  tmp_path: Path,
              ) -> None:
                  detector = RegimeDetector(
                      _config(
                          tmp_path,
                          {
                              "enabled": True,
                              "short_window": 2,
                              "long_window": 3,
                          },
                      )
                  )
                  regimes = detector.detect(_prices())

                  assert detector.regime_on("2026-01-01", regimes) is None
                  assert detector.regime_on("2026-01-04", regimes) == "bull"
                  assert detector.regime_on("2026-01-05", regimes) == "bear"
                  assert detector.regime_on("2026-01-07", regimes) is None


              def test_overlay_activation_respects_configuration(
                  tmp_path: Path,
              ) -> None:
                  disabled = RegimeDetector(_config(tmp_path))
                  assert disabled.is_overlay_active("bull") is False

                  enabled = RegimeDetector(
                      _config(
                          tmp_path,
                          {
                              "enabled": True,
                              "active_regimes": ["bull", "range"],
                          },
                      )
                  )
                  assert enabled.is_overlay_active("bull") is True
                  assert enabled.is_overlay_active("range") is True
                  assert enabled.is_overlay_active("bear") is False
                  assert enabled.is_overlay_active(None) is False


              def test_detect_rejects_missing_required_columns(
                  tmp_path: Path,
              ) -> None:
                  detector = RegimeDetector(_config(tmp_path))

                  with pytest.raises(ValueError, match="close"):
                      detector.detect(pd.DataFrame({"date": ["2026-01-01"]}))


              def test_rejects_invalid_windows(tmp_path: Path) -> None:
                  with pytest.raises(ValueError, match="正の整数"):
                      RegimeDetector(
                          _config(
                              tmp_path,
                              {
                                  "short_window": 0,
                                  "long_window": 200,
                              },
                          )
                      )

                  with pytest.raises(ValueError, match="short_window"):
                      RegimeDetector(
                          _config(
                              tmp_path,
                              {
                                  "short_window": 200,
                                  "long_window": 50,
                              },
                          )
                      )
              '''
              ),
              encoding="utf-8",
          )

          for workflow in (
              ".github/workflows/apply-regime-overlay.yml",
              ".github/workflows/trigger-regime-overlay.yml",
              ".github/workflows/finalize-regime-overlay.yml",
          ):
              path = Path(workflow)
              if path.exists():
                  path.unlink()
          PY

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate changed implementation
        run: |
          python -m pytest tests/test_regime_detector.py -q
          python -m pytest tests/ -m "not slow" -q
          ruff check src/backtest_runner.py src/regime_detector.py src/models.py src/data_store.py tests/test_regime_detector.py
          pyright src/backtest_runner.py src/regime_detector.py tests/test_regime_detector.py
          git diff --check

      - name: Record full pyright baseline
        continue-on-error: true
        run: pyright

      - name: Commit and push to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backtest_runner.py src/regime_detector.py src/models.py src/data_store.py tests/test_regime_detector.py .github/workflows/apply-regime-overlay.yml .github/workflows/trigger-regime-overlay.yml .github/workflows/finalize-regime-overlay.yml
          git commit -m "feat: add regime-aware idle cash overlay"
          git push origin HEAD:master
