name: apply verified handoff split

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/_apply_verified_handoff_split.py
      - .github/workflows/_apply-verified-handoff-split.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/verified-readonly-handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verified-readonly-handoff
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repair applicator formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_apply_verified_handoff_split.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'text += (\\n                ',
              'text += (' + chr(10) + '                ',
          )
          text = text.replace(
              '    run(\\n        sys.executable,',
              '    run(' + chr(10) + '        sys.executable,',
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python -m py_compile scripts/_apply_verified_handoff_split.py
      - name: Apply split and push
        run: python scripts/_apply_verified_handoff_split.py
