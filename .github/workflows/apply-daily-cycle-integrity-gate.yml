name: apply-daily-cycle-integrity-gate

on:
  push:
    branches:
      - fix/daily-cycle-integrity-gate
    paths:
      - .github/scripts/apply_daily_cycle_integrity_gate.py
      - .github/workflows/apply-daily-cycle-integrity-gate.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-cycle-integrity-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply daily-cycle integrity gate
        run: python .github/scripts/apply_daily_cycle_integrity_gate.py
      - name: Commit final patch
        run: |
          rm .github/scripts/apply_daily_cycle_integrity_gate.py
          rm .github/workflows/apply-daily-cycle-integrity-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: gate daily cycle on virtual-trade integrity'
          git push origin HEAD:fix/daily-cycle-integrity-gate
