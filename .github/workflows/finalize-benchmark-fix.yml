name: Finalize benchmark fix validation

on:
  push:
    branches:
      - agent/benchmark-corporate-action-fix
    paths:
      - .github/workflows/finalize-benchmark-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/benchmark-corporate-action-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final lint fixes
        shell: python
        run: |
          from pathlib import Path

          evaluation = Path("src/backtest_evaluation.py")
          text = evaluation.read_text(encoding="utf-8")
          old = '    benchmarks = report["benchmarks"]\n'
          if text.count(old) != 1:
              raise SystemExit(f"unexpected benchmarks assignment count: {text.count(old)}")
          evaluation.write_text(text.replace(old, "", 1), encoding="utf-8", newline="\n")

          benchmarking = Path("src/benchmarking.py")
          text = benchmarking.read_text(encoding="utf-8")
          old = "from typing import Any, Iterable, Mapping, Optional\n"
          new = "from typing import Any, Mapping, Optional\n"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected typing import count: {text.count(old)}")
          benchmarking.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          for temporary in (
              Path(".ruff-benchmark.txt"),
              Path(".github/workflows/finalize-benchmark-fix.yml"),
          ):
              if temporary.exists():
                  temporary.unlink()
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest pyyaml pandas ruff
      - name: Validate changed sources
        run: |
          ruff check \
            src/benchmarking.py \
            src/backtest_runner.py \
            src/benchmark.py \
            src/backtest_evaluation.py \
            src/walk_forward_validation.py \
            validated_backtest.py \
            historical_backtest.py \
            scripts/rerun_p2_benchmarks.py \
            tests/test_benchmarking.py
          python -m compileall -q \
            src/benchmarking.py \
            src/backtest_runner.py \
            src/benchmark.py \
            src/backtest_evaluation.py \
            src/walk_forward_validation.py \
            validated_backtest.py \
            historical_backtest.py \
            scripts/rerun_p2_benchmarks.py
          python -m pytest -q tests/test_benchmarking.py
      - name: Commit finalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve benchmark validation lint"
          git push origin HEAD:agent/benchmark-corporate-action-fix
