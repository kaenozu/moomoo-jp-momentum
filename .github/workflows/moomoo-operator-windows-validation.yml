name: moomoo operator Windows validation

on:
  pull_request:
    paths:
      - "tools/production_discovery/**"
      - "scripts/build_moomoo_discovery_operator_bundle.py"
      - ".github/workflows/moomoo-operator-windows-validation.yml"
  push:
    branches:
      - master
    paths:
      - "tools/production_discovery/**"
      - "scripts/build_moomoo_discovery_operator_bundle.py"
      - ".github/workflows/moomoo-operator-windows-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  windows-powershell-5:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Run static and regression validation
        shell: powershell
        run: >-
          .\tools\production_discovery\run_moomoo_discovery_operator_tests.ps1
          -PythonExecutable python
          -PowerShellExecutable powershell.exe
      - name: Build operator bundle
        run: python .\scripts\build_moomoo_discovery_operator_bundle.py
      - name: Verify tracked repository unchanged
        shell: powershell
        run: |
          & git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Validation modified tracked files" }
          & git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Validation modified the index" }
      - uses: actions/upload-artifact@v4
        with:
          name: moomoo-discovery-operator-v1.2.0-powershell5
          path: dist/moomoo_production_discovery_operator_v4_v1.2.0.zip
          if-no-files-found: error
          retention-days: 7

  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Run static and regression validation
        shell: pwsh
        run: >-
          .\tools\production_discovery\run_moomoo_discovery_operator_tests.ps1
          -PythonExecutable python
          -PowerShellExecutable pwsh.exe
      - name: Build operator bundle
        run: python .\scripts\build_moomoo_discovery_operator_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: moomoo-discovery-operator-v1.2.0-powershell7
          path: dist/moomoo_production_discovery_operator_v4_v1.2.0.zip
          if-no-files-found: error
          retention-days: 7
