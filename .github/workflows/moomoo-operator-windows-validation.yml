name: moomoo operator Windows validation

on:
  pull_request:
    paths:
      - ".gitattributes"
      - "tools/production_discovery/**"
      - "scripts/build_moomoo_discovery_operator_bundle.py"
      - "scripts/compare_moomoo_discovery_operator_bundles.py"
      - ".github/workflows/moomoo-operator-windows-validation.yml"
  push:
    branches:
      - master
    paths:
      - ".gitattributes"
      - "tools/production_discovery/**"
      - "scripts/build_moomoo_discovery_operator_bundle.py"
      - "scripts/compare_moomoo_discovery_operator_bundles.py"
      - ".github/workflows/moomoo-operator-windows-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "1783900800"

jobs:
  windows-powershell-5:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Prepare diagnostics and record checkout state
        shell: powershell
        run: |
          $Diagnostics = "$env:RUNNER_TEMP\operator-diagnostics-ps5"
          New-Item -ItemType Directory -Path $Diagnostics -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\ps5-build-a" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\ps5-build-b" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\ps5-artifact" -Force | Out-Null
          $PSVersionTable | Out-String | Set-Content "$Diagnostics\powershell-version.txt"
          & git check-attr text eol -- tools/production_discovery/*.ps1 2>&1 |
            Tee-Object "$Diagnostics\git-attributes.txt"
          & git ls-files --eol -- tools/production_discovery scripts/*.py 2>&1 |
            Tee-Object "$Diagnostics\git-eol.txt"
      - name: Run parser, static, regression, and synthetic validation
        shell: powershell
        run: |
          $Diagnostics = "$env:RUNNER_TEMP\operator-diagnostics-ps5"
          & .\tools\production_discovery\run_moomoo_discovery_operator_tests.ps1 `
            -PythonExecutable python `
            -PowerShellExecutable powershell.exe `
            -DiagnosticsDir $Diagnostics *>&1 |
              Tee-Object -FilePath "$Diagnostics\validation.log"
      - name: Build twice and compare on Windows PowerShell 5.1 runner
        shell: cmd
        run: |
          python .\scripts\build_moomoo_discovery_operator_bundle.py --output-dir "%RUNNER_TEMP%\ps5-build-a" --json-output "%RUNNER_TEMP%\operator-diagnostics-ps5\build-a.json" > "%RUNNER_TEMP%\operator-diagnostics-ps5\build-a.log" 2>&1
          if errorlevel 1 exit /b 1
          python .\scripts\build_moomoo_discovery_operator_bundle.py --output-dir "%RUNNER_TEMP%\ps5-build-b" --json-output "%RUNNER_TEMP%\operator-diagnostics-ps5\build-b.json" > "%RUNNER_TEMP%\operator-diagnostics-ps5\build-b.log" 2>&1
          if errorlevel 1 exit /b 1
          python .\scripts\compare_moomoo_discovery_operator_bundles.py --left "%RUNNER_TEMP%\ps5-build-a\moomoo_production_discovery_operator_v4_v1.2.2.zip" --right "%RUNNER_TEMP%\ps5-build-b\moomoo_production_discovery_operator_v4_v1.2.2.zip" --output "%RUNNER_TEMP%\operator-diagnostics-ps5\same-shell-comparison.json" > "%RUNNER_TEMP%\operator-diagnostics-ps5\same-shell-comparison.log" 2>&1
          if errorlevel 1 exit /b 1
          copy /Y "%RUNNER_TEMP%\ps5-build-a\moomoo_production_discovery_operator_v4_v1.2.2.zip" "%RUNNER_TEMP%\ps5-artifact\moomoo_production_discovery_operator_v4_v1.2.2.zip"
          if errorlevel 1 exit /b 1
      - name: Verify tracked repository unchanged
        shell: powershell
        run: |
          & git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Validation modified tracked files" }
          & git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Validation modified the index" }
          $Status = @(& git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw "git status failed" }
          if ($Status.Count -ne 0) {
            $Status | ForEach-Object { Write-Error $_ }
            throw "Validation created repository artifacts"
          }
      - name: Upload PowerShell 5.1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moomoo-operator-v1.2.2-diagnostics-powershell5
          path: ${{ runner.temp }}/operator-diagnostics-ps5
          if-no-files-found: warn
          retention-days: 14
      - name: Upload PowerShell 5.1 bundle
        uses: actions/upload-artifact@v4
        with:
          name: moomoo-discovery-operator-v1.2.2-powershell5
          path: ${{ runner.temp }}/ps5-artifact/moomoo_production_discovery_operator_v4_v1.2.2.zip
          if-no-files-found: error
          retention-days: 14

  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Prepare diagnostics and record checkout state
        shell: pwsh
        run: |
          $Diagnostics = "$env:RUNNER_TEMP\operator-diagnostics-ps7"
          New-Item -ItemType Directory -Path $Diagnostics -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\ps7-build-a" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\ps7-build-b" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\ps7-artifact" -Force | Out-Null
          $PSVersionTable | Out-String | Set-Content "$Diagnostics\powershell-version.txt"
          & git check-attr text eol -- tools/production_discovery/*.ps1 2>&1 |
            Tee-Object "$Diagnostics\git-attributes.txt"
          & git ls-files --eol -- tools/production_discovery scripts/*.py 2>&1 |
            Tee-Object "$Diagnostics\git-eol.txt"
      - name: Run parser, static, regression, and synthetic validation
        shell: pwsh
        run: |
          $Diagnostics = "$env:RUNNER_TEMP\operator-diagnostics-ps7"
          & .\tools\production_discovery\run_moomoo_discovery_operator_tests.ps1 `
            -PythonExecutable python `
            -PowerShellExecutable pwsh.exe `
            -DiagnosticsDir $Diagnostics *>&1 |
              Tee-Object -FilePath "$Diagnostics\validation.log"
      - name: Build twice and compare on PowerShell 7 runner
        shell: cmd
        run: |
          python .\scripts\build_moomoo_discovery_operator_bundle.py --output-dir "%RUNNER_TEMP%\ps7-build-a" --json-output "%RUNNER_TEMP%\operator-diagnostics-ps7\build-a.json" > "%RUNNER_TEMP%\operator-diagnostics-ps7\build-a.log" 2>&1
          if errorlevel 1 exit /b 1
          python .\scripts\build_moomoo_discovery_operator_bundle.py --output-dir "%RUNNER_TEMP%\ps7-build-b" --json-output "%RUNNER_TEMP%\operator-diagnostics-ps7\build-b.json" > "%RUNNER_TEMP%\operator-diagnostics-ps7\build-b.log" 2>&1
          if errorlevel 1 exit /b 1
          python .\scripts\compare_moomoo_discovery_operator_bundles.py --left "%RUNNER_TEMP%\ps7-build-a\moomoo_production_discovery_operator_v4_v1.2.2.zip" --right "%RUNNER_TEMP%\ps7-build-b\moomoo_production_discovery_operator_v4_v1.2.2.zip" --output "%RUNNER_TEMP%\operator-diagnostics-ps7\same-shell-comparison.json" > "%RUNNER_TEMP%\operator-diagnostics-ps7\same-shell-comparison.log" 2>&1
          if errorlevel 1 exit /b 1
          copy /Y "%RUNNER_TEMP%\ps7-build-a\moomoo_production_discovery_operator_v4_v1.2.2.zip" "%RUNNER_TEMP%\ps7-artifact\moomoo_production_discovery_operator_v4_v1.2.2.zip"
          if errorlevel 1 exit /b 1
      - name: Verify tracked repository unchanged
        shell: pwsh
        run: |
          & git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Validation modified tracked files" }
          & git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Validation modified the index" }
          $Status = @(& git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw "git status failed" }
          if ($Status.Count -ne 0) {
            $Status | ForEach-Object { Write-Error $_ }
            throw "Validation created repository artifacts"
          }
      - name: Upload PowerShell 7 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moomoo-operator-v1.2.2-diagnostics-powershell7
          path: ${{ runner.temp }}/operator-diagnostics-ps7
          if-no-files-found: warn
          retention-days: 14
      - name: Upload PowerShell 7 bundle
        uses: actions/upload-artifact@v4
        with:
          name: moomoo-discovery-operator-v1.2.2-powershell7
          path: ${{ runner.temp }}/ps7-artifact/moomoo_production_discovery_operator_v4_v1.2.2.zip
          if-no-files-found: error
          retention-days: 14

  compare-bundles:
    name: Compare PowerShell 5.1 and PowerShell 7 bundles
    needs:
      - windows-powershell-5
      - powershell-7
    if: ${{ needs.windows-powershell-5.result == 'success' && needs.powershell-7.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: moomoo-discovery-operator-v1.2.2-powershell5
          path: artifacts/powershell5
      - uses: actions/download-artifact@v4
        with:
          name: moomoo-discovery-operator-v1.2.2-powershell7
          path: artifacts/powershell7
      - name: Compare cross-shell bundles byte for byte
        run: >-
          python ./scripts/compare_moomoo_discovery_operator_bundles.py
          --left ./artifacts/powershell5/moomoo_production_discovery_operator_v4_v1.2.2.zip
          --right ./artifacts/powershell7/moomoo_production_discovery_operator_v4_v1.2.2.zip
          --output ./cross-shell-comparison.json
      - name: Upload cross-shell comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moomoo-operator-v1.2.2-cross-shell-comparison
          path: cross-shell-comparison.json
          if-no-files-found: warn
          retention-days: 14
