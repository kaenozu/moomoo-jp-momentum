name: patch operator test version

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/_patch_operator_test_version.py
      - .github/workflows/_patch-operator-test-version.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/operator-v1.2.2-windows-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-v1.2.2-windows-hardening
          fetch-depth: 0
      - name: Apply and push
        run: python scripts/_patch_operator_test_version.py
