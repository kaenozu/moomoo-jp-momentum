name: windows recovery drill

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows-powershell-desktop:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        shell: powershell
        run: python -m pip install -r requirements.txt

      - name: Verify Windows PowerShell version
        shell: powershell
        run: |
          $Version = $PSVersionTable.PSVersion
          Write-Host "PSEdition=$($PSVersionTable.PSEdition) Version=$Version"
          if ($Version.Major -ne 5) {
              throw "Expected Windows PowerShell 5.x, got $Version"
          }

      - name: Parse drill scripts
        shell: powershell
        run: |
          foreach ($Path in @(
              "scripts/sqlite_backup_recovery_drill.ps1",
              "tests/run_database_backup_drill_windows.ps1"
          )) {
              $Tokens = $null
              $Errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $Path,
                  [ref]$Tokens,
                  [ref]$Errors
              ) | Out-Null
              if ($Errors.Count -gt 0) {
                  $Errors | ForEach-Object { Write-Error $_.Message }
                  throw "PowerShell parse errors in $Path"
              }
          }

      - name: Run guards and full recovery simulation
        shell: powershell
        run: |
          $LogPath = Join-Path $env:RUNNER_TEMP "windows-recovery-powershell-5.log"
          $Raw = & powershell -NoProfile -NonInteractive `
              -ExecutionPolicy Bypass `
              -File tests/run_database_backup_drill_windows.ps1 `
              -ShellExecutable powershell `
              -CaseName windows-powershell-5 2>&1
          $ExitCode = $LASTEXITCODE
          $Raw | Set-Content -Encoding utf8 -LiteralPath $LogPath
          $Raw | ForEach-Object { Write-Host $_ }
          if ($ExitCode -ne 0) {
              throw "Windows PowerShell recovery drill failed with exit code $ExitCode"
          }

      - name: Verify no repository artifacts
        if: always()
        shell: powershell
        run: |
          $Status = & git status --porcelain
          if ($LASTEXITCODE -ne 0) { throw "Could not read git status" }
          if ($Status) {
              $Status | ForEach-Object { Write-Error $_ }
              throw "Recovery drill created repository artifacts"
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-recovery-powershell-5
          path: |
            ${{ runner.temp }}/windows-recovery-powershell-5.log
            ${{ runner.temp }}/sqlite recovery drill *
          if-no-files-found: warn
          retention-days: 3

  windows-powershell-core:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Verify PowerShell version
        shell: pwsh
        run: |
          $Version = $PSVersionTable.PSVersion
          Write-Host "PSEdition=$($PSVersionTable.PSEdition) Version=$Version"
          if ($Version.Major -lt 7) {
              throw "Expected PowerShell 7+, got $Version"
          }

      - name: Parse drill scripts
        shell: pwsh
        run: |
          foreach ($Path in @(
              "scripts/sqlite_backup_recovery_drill.ps1",
              "tests/run_database_backup_drill_windows.ps1"
          )) {
              $Tokens = $null
              $Errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $Path,
                  [ref]$Tokens,
                  [ref]$Errors
              ) | Out-Null
              if ($Errors.Count -gt 0) {
                  $Errors | ForEach-Object { Write-Error $_.Message }
                  throw "PowerShell parse errors in $Path"
              }
          }

      - name: Run guards and full recovery simulation
        shell: pwsh
        run: |
          $LogPath = Join-Path $env:RUNNER_TEMP "windows-recovery-powershell-7.log"
          $Raw = & pwsh -NoProfile -NonInteractive `
              -ExecutionPolicy Bypass `
              -File tests/run_database_backup_drill_windows.ps1 `
              -ShellExecutable pwsh `
              -CaseName powershell-7 2>&1
          $ExitCode = $LASTEXITCODE
          $Raw | Set-Content -Encoding utf8 -LiteralPath $LogPath
          $Raw | ForEach-Object { Write-Host $_ }
          if ($ExitCode -ne 0) {
              throw "PowerShell 7 recovery drill failed with exit code $ExitCode"
          }

      - name: Verify no repository artifacts
        if: always()
        shell: pwsh
        run: |
          $Status = & git status --porcelain
          if ($LASTEXITCODE -ne 0) { throw "Could not read git status" }
          if ($Status) {
              $Status | ForEach-Object { Write-Error $_ }
              throw "Recovery drill created repository artifacts"
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-recovery-powershell-7
          path: |
            ${{ runner.temp }}/windows-recovery-powershell-7.log
            ${{ runner.temp }}/sqlite recovery drill *
          if-no-files-found: warn
          retention-days: 3
