name: apply relative-strength config fix

on:
  push:
    branches:
      - fix/strategy-runner-benchmark-date
    paths:
      - relative-strength-config.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strategy-runner-benchmark-date
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply config fix
        run: |
          python scripts/apply_relative_strength_config.py
          rm -f scripts/apply_relative_strength_config.py
          rm -f relative-strength-config.trigger
          rm -f .github/workflows/apply-relative-strength-config.yml

      - name: Commit config fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: read relative-strength periods from current config"
          git push origin HEAD:fix/strategy-runner-benchmark-date
