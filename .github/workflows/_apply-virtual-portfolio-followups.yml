name: temporary apply virtual portfolio follow-ups

on:
  push:
    branches:
      - agent/virtual-portfolio-identity
    paths:
      - scripts/_apply_virtual_portfolio_followups.py
      - .github/workflows/_apply-virtual-portfolio-followups.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/virtual-portfolio-identity
          fetch-depth: 0
      - name: Apply and commit follow-ups
        run: |
          python scripts/_apply_virtual_portfolio_followups.py
          python -m py_compile src/database_backup.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/database_backup.py scripts/sqlite_backup_recovery_drill.ps1
          git commit -m "fix: preserve portfolio restore API compatibility"
          git push origin HEAD:agent/virtual-portfolio-identity
