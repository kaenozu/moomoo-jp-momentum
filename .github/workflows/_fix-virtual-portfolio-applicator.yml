name: temporary fix virtual portfolio applicator

on:
  push:
    branches:
      - agent/virtual-portfolio-identity
    paths:
      - scripts/_fix_virtual_portfolio_applicator.py
      - .github/workflows/_fix-virtual-portfolio-applicator.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/virtual-portfolio-identity
          fetch-depth: 0
      - name: Fix contract and commit
        run: |
          python scripts/_fix_virtual_portfolio_applicator.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/_apply_virtual_portfolio_identity.py
          git commit -m "chore: fix portfolio applicator contract"
          git push origin HEAD:agent/virtual-portfolio-identity
