name: apply score defense

on:
  push:
    branches:
      - fix/backtest-score-ranking
    paths:
      - score-defense.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backtest-score-ranking
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply patch
        run: |
          python scripts/apply_score_defense.py
          rm -f scripts/apply_score_defense.py score-defense.trigger .github/workflows/apply-score-defense.yml

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify
        run: |
          python -m pytest tests/ -m "not slow" -q
          ruff check src/ tests/ run_daily_cycle.py daily_update.py historical_backtest.py screen_candidates.py scheduler.py performance_report.py
          pyright
          python run_daily_cycle.py --dry-run --config tests/fixtures/config.test.yaml
          test ! -e data/moomoo.db
          test ! -d logs
          test ! -d reports

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: handle missing backtest scores defensively"
          git push origin HEAD:fix/backtest-score-ranking
