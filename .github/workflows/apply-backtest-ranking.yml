name: apply backtest ranking fix

on:
  push:
    branches:
      - fix/backtest-score-ranking
    paths:
      - backtest-ranking.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backtest-score-ranking
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply patch
        run: |
          python scripts/apply_backtest_ranking_fix.py
          rm -f scripts/apply_backtest_ranking_fix.py backtest-ranking.trigger .github/workflows/apply-backtest-ranking.yml

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -q

      - name: Run ruff
        run: >-
          ruff check src/ tests/ run_daily_cycle.py daily_update.py
          historical_backtest.py screen_candidates.py scheduler.py
          performance_report.py --output-format=github

      - name: Run pyright
        run: pyright

      - name: Run read-only dry-run
        run: python run_daily_cycle.py --dry-run --config tests/fixtures/config.test.yaml

      - name: Verify no runtime artifacts
        run: |
          test ! -e data/moomoo.db
          test ! -d logs
          test ! -d reports

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rank backtest buys by strategy score"
          git push origin HEAD:fix/backtest-score-ranking
