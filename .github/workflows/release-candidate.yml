name: release candidate

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    outputs:
      archive_sha256: ${{ steps.archive-hash.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.txt --requirement requirements-dev.txt
          python -m pip check

      - name: Build and verify twice
        shell: pwsh
        run: |
          $expected = "VALIDATION_ONLY"
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/master") {
            $expected = "MASTER_RELEASE_CANDIDATE"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          python -m scripts.build_release_candidate `
            --output dist/moomoo-source-release-candidate.zip `
            --repository "${{ github.repository }}" `
            --source-commit "${{ github.sha }}" `
            --source-ref "${{ github.ref }}" `
            --source-event "${{ github.event_name }}"
          python -m scripts.build_release_candidate `
            --output dist/moomoo-source-release-candidate-second.zip `
            --repository "${{ github.repository }}" `
            --source-commit "${{ github.sha }}" `
            --source-ref "${{ github.ref }}" `
            --source-event "${{ github.event_name }}"
          python -c "from pathlib import Path; first=Path('dist/moomoo-source-release-candidate.zip').read_bytes(); second=Path('dist/moomoo-source-release-candidate-second.zip').read_bytes(); raise SystemExit(first != second)"
          python -m scripts.verify_release_candidate `
            dist/moomoo-source-release-candidate.zip `
            --expected-repository "${{ github.repository }}" `
            --expected-commit "${{ github.sha }}" `
            --expected-ref "${{ github.ref }}" `
            --expected-event "${{ github.event_name }}" `
            --expected-status $expected

      - name: Publish Windows archive hash
        id: archive-hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/moomoo-source-release-candidate.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "archive_sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Windows archive SHA-256: $hash"

  build-linux:
    runs-on: ubuntu-24.04
    needs: build-windows
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git show --check --format= HEAD
          else
            git diff --check "$PUSH_BEFORE_SHA...HEAD"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --requirement requirements.txt \
            --requirement requirements-dev.txt
          python -m pip check

      - name: Run focused quality gates
        run: |
          python -m pytest -q tests/test_release_candidate.py
          ruff check src/release_candidate.py scripts/build_release_candidate.py scripts/verify_release_candidate.py tests/test_release_candidate.py
          pyright src/release_candidate.py scripts/build_release_candidate.py scripts/verify_release_candidate.py tests/test_release_candidate.py
          python -m compileall -q src/release_candidate.py scripts/build_release_candidate.py scripts/verify_release_candidate.py tests/test_release_candidate.py

      - name: Build and verify twice
        shell: bash
        run: |
          EXPECTED_STATUS=VALIDATION_ONLY
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            EXPECTED_STATUS=MASTER_RELEASE_CANDIDATE
          fi
          mkdir -p dist
          python -m scripts.build_release_candidate \
            --output dist/moomoo-source-release-candidate.zip \
            --repository "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref }}" \
            --source-event "${{ github.event_name }}"
          python -m scripts.build_release_candidate \
            --output dist/moomoo-source-release-candidate-second.zip \
            --repository "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref }}" \
            --source-event "${{ github.event_name }}"
          cmp dist/moomoo-source-release-candidate.zip dist/moomoo-source-release-candidate-second.zip
          python -m scripts.verify_release_candidate \
            dist/moomoo-source-release-candidate.zip \
            --expected-repository "${{ github.repository }}" \
            --expected-commit "${{ github.sha }}" \
            --expected-ref "${{ github.ref }}" \
            --expected-event "${{ github.event_name }}" \
            --expected-status "$EXPECTED_STATUS"

      - name: Compare Windows and Linux artifacts
        shell: bash
        run: |
          LINUX_SHA=$(sha256sum dist/moomoo-source-release-candidate.zip | awk '{print $1}')
          WINDOWS_SHA="${{ needs.build-windows.outputs.archive_sha256 }}"
          test "$LINUX_SHA" = "$WINDOWS_SHA"
          printf '%s  %s\n' "$LINUX_SHA" moomoo-source-release-candidate.zip \
            > dist/moomoo-source-release-candidate.zip.sha256
          echo "Cross-platform archive SHA-256: $LINUX_SHA"

      - name: Upload verified release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: moomoo-source-rc-${{ github.sha }}
          path: |
            dist/moomoo-source-release-candidate.zip
            dist/moomoo-source-release-candidate.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
