name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Record pre-run file listing
        run: find data logs reports -type f 2>/dev/null | sort > /tmp/pre_files.txt || true

      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -q

      - name: Run ruff
        run: ruff check --output-format=github src/ tests/ run_daily_cycle.py

      - name: Run pyright
        run: pyright

      - name: Dry-run with test config
        run: python run_daily_cycle.py --dry-run --config tests/fixtures/config.test.yaml

      - name: Verify no artifacts were created
        run: |
          find data logs reports -type f 2>/dev/null | sort > /tmp/post_files.txt || true
          NEW_FILES=$(diff /tmp/pre_files.txt /tmp/post_files.txt 2>/dev/null | grep "^>" | sed 's/^> //' || true)
          if [ -n "$NEW_FILES" ]; then
            echo "ERROR: New files were created during dry-run:"
            echo "$NEW_FILES"
            exit 1
          fi
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: git status shows uncommitted changes"
            exit 1
          fi
          echo "OK: No artifacts created"
