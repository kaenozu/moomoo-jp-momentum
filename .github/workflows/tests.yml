name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-lock-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # CPython 3.11.9 is the newest 3.11 patch with an official
          # actions/python-versions Windows x64 artifact.
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py311.txt

      - name: Install and verify locked dependencies
        run: |
          python --version
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --constraint constraints/py311.txt --requirement requirements.txt --requirement requirements-dev.txt
          python -m pip check
          python scripts/verify_locked_requirements.py
          python -m compileall -q src scripts tests

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git show --check --format= HEAD
          else
            git diff --check "$PUSH_BEFORE_SHA...HEAD"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py311.txt

      - name: Install locked dependencies
        run: |
          python --version
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install \
            --constraint constraints/py311.txt \
            --requirement requirements.txt \
            --requirement requirements-dev.txt
          python -m pip check
          python scripts/verify_locked_requirements.py

      - name: Record pre-run file listing
        run: find data logs reports -type f 2>/dev/null | sort > /tmp/pre_files.txt || true

      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -q

      - name: Run ruff
        run: >-
          ruff check --output-format=github
          src/ tests/ scripts/validate_source_manifest.py scripts/verify_locked_requirements.py run_daily_cycle.py

      - name: Run pyright
        run: pyright

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Validate deterministic source manifest twice
        run: |
          mkdir -p /tmp/source-manifest
          python -m scripts.validate_source_manifest \
            --source-commit "${{ github.sha }}" \
            --output /tmp/source-manifest/first.json
          python -m scripts.validate_source_manifest \
            --source-commit "${{ github.sha }}" \
            --output /tmp/source-manifest/second.json
          cmp /tmp/source-manifest/first.json /tmp/source-manifest/second.json

      - name: Dry-run with test config
        run: python run_daily_cycle.py --dry-run --config tests/fixtures/config.test.yaml

      - name: Test skip-fetch with isolated seeded data
        run: |
          TMP_DIR=$(mktemp -d)
          TARGET_DATE=$(date -u +%F)
          TMP_CONFIG="$TMP_DIR/config.test.yaml"
          python - "$TMP_CONFIG" "$TMP_DIR/moomoo.db" "$GITHUB_WORKSPACE/data/symbols.json" <<'PY'
          import sys
          from pathlib import Path

          import yaml

          config = yaml.safe_load(
              Path("tests/fixtures/config.test.yaml").read_text(encoding="utf-8")
          )
          config["database"]["path"] = sys.argv[2]
          config["watchlist"]["symbols_file"] = sys.argv[3]
          config["report"]["output_dir"] = str(Path(sys.argv[1]).parent / "reports")
          config["alerts"]["file"] = False
          Path(sys.argv[1]).write_text(
              yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          PY
          PYTHONPATH="$GITHUB_WORKSPACE" python - "$TMP_CONFIG" "$TARGET_DATE" <<'PY'
          import sys

          from src.config import load_config
          from src.data_store import DataStore
          from src.models import DailyBar

          config = load_config(sys.argv[1])
          store = DataStore(config)
          store.sync_symbols_from_json()
          store.save_daily_bar(
              DailyBar(
                  code="JP.1306",
                  date=sys.argv[2],
                  open=100.0,
                  high=101.0,
                  low=99.0,
                  close=100.5,
                  volume=1000,
                  turnover=100500.0,
                  source="fixture",
                  turnover_source="estimated",
              )
          )
          PY
          (
            cd "$TMP_DIR"
            PYTHONPATH="$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/run_daily_cycle.py" \
              --date "$TARGET_DATE" \
              --skip-fetch \
              --config "$TMP_CONFIG"
          )
          rm -rf "$TMP_DIR"

      - name: Verify no artifacts were created
        run: |
          find data logs reports -type f 2>/dev/null | sort > /tmp/post_files.txt || true
          NEW_FILES=$(diff /tmp/pre_files.txt /tmp/post_files.txt 2>/dev/null | grep "^>" | sed 's/^> //' || true)
          if [ -n "$NEW_FILES" ]; then
            echo "ERROR: New files were created during dry-run:"
            echo "$NEW_FILES"
            exit 1
          fi
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: git status shows uncommitted changes"
            exit 1
          fi
          echo "OK: No artifacts created"
