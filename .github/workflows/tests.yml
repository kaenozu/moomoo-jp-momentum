name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-execution-reproducibility
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply final V2 validation patch
        run: python scripts/apply_v2_validation_final_patch.py
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -r requirements-dev.txt
      - name: Validate final implementation
        run: |
          python -m pytest tests/ -m "not slow" -q
          ruff check src/ tests/ scripts/validate_v2_migration.py scripts/compare_backtest_runs.py run_daily_cycle.py
          pyright
          python -m py_compile scripts/validate_v2_migration.py scripts/compare_backtest_runs.py
          python run_daily_cycle.py --dry-run --config tests/fixtures/config.test.yaml
      - name: Restore workflow and commit validated source
        run: |
          git fetch origin agent/fix-full-source-review
          git show FETCH_HEAD:.github/workflows/tests.yml > .github/workflows/tests.yml
          rm scripts/apply_v2_validation_final_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reject unsafe v2 validation inputs'
          git push origin HEAD:agent/v2-execution-reproducibility
