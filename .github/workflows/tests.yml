name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -q

      - name: Run ruff (src, tests, CLI)
        run: ruff check --output-format=github src/ tests/ run_daily_cycle.py

      - name: Run pyright
        run: pyright run_daily_cycle.py src/virtual_trade.py src/config.py tests/

      - name: Test dry-run with test config
        run: python run_daily_cycle.py --dry-run --config tests/fixtures/config.test.yaml

      - name: Test skip-fetch with test config
        run: python run_daily_cycle.py --date 2026-07-10 --skip-fetch --config tests/fixtures/config.test.yaml
