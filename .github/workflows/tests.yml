name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-cash-history-refinements:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/virtual-cash-from-fills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/virtual-cash-from-fills
          fetch-depth: 0
      - name: Apply cash history safety refinements
        run: python .agent_refine_cash_history.py
      - name: Commit final refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/virtual_trade.py tests/test_virtual_trade_cash_history.py .github/workflows/tests.yml
          git add -u .agent_refine_cash_history.py .agent_original_tests.yml
          git commit -m "fix: preserve manual cash and benchmark history"
          git push origin HEAD:fix/virtual-cash-from-fills
