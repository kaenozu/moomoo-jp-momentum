name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for pre-existing artifacts
        run: |
          echo "=== git status before ==="
          git status --porcelain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -q

      - name: Run ruff
        run: ruff check src/ tests/ run_daily_cycle.py daily_update.py historical_backtest.py screen_candidates.py scheduler.py performance_report.py --output-format=github

      - name: Run pyright
        run: pyright

      - name: Test dry-run with test config
        run: python run_daily_cycle.py --dry-run --config tests/fixtures/config.test.yaml

      - name: Verify no artifacts created
        run: |
          echo "=== git status after ==="
          git status --porcelain
          if git status --porcelain | grep -q .; then
            echo "ERROR: New files were created by the test run" >&2
            git status --porcelain
            exit 1
          fi
          test ! -e data/moomoo.db || { echo "ERROR: data/moomoo.db was created"; exit 1; }
          test ! -d logs || { echo "ERROR: logs/ was created"; exit 1; }
          test ! -d reports || { echo "ERROR: reports/ was created"; exit 1; }
          echo "OK: No artifacts created"
