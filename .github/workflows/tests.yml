name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Record pre-run file listing
        run: find data logs reports -type f 2>/dev/null | sort > /tmp/pre_files.txt || true

      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -q

      - name: Run ruff
        run: ruff check --output-format=github src/ tests/ run_daily_cycle.py

      - name: Run pyright
        id: pyright
        continue-on-error: true
        run: pyright --outputjson > /tmp/pyright.json

      - name: Upload pyright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-overlap-final-pyright
          path: /tmp/pyright.json

      - name: Fail on pyright diagnostics
        if: steps.pyright.outcome == 'failure'
        run: exit 1

      - name: Dry-run with test config
        run: python run_daily_cycle.py --dry-run --config tests/fixtures/config.test.yaml

      - name: Test skip-fetch with isolated seeded data
        run: |
          TMP_DIR=$(mktemp -d)
          TARGET_DATE=$(date -u +%F)
          TMP_CONFIG="$TMP_DIR/config.test.yaml"
          python - "$TMP_CONFIG" "$TMP_DIR/moomoo.db" "$GITHUB_WORKSPACE/data/symbols.json" <<'PY'
          import sys
          from pathlib import Path

          import yaml

          config = yaml.safe_load(
              Path("tests/fixtures/config.test.yaml").read_text(encoding="utf-8")
          )
          config["database"]["path"] = sys.argv[2]
          config["watchlist"]["symbols_file"] = sys.argv[3]
          config["report"]["output_dir"] = str(Path(sys.argv[1]).parent / "reports")
          config["alerts"]["file"] = False
          Path(sys.argv[1]).write_text(
              yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          PY
          PYTHONPATH="$GITHUB_WORKSPACE" python - "$TMP_CONFIG" "$TARGET_DATE" <<'PY'
          import sys

          from src.config import load_config
          from src.data_store import DataStore
          from src.models import DailyBar

          config = load_config(sys.argv[1])
          store = DataStore(config)
          store.sync_symbols_from_json()
          store.save_daily_bar(
              DailyBar(
                  code="JP.1306",
                  date=sys.argv[2],
                  open=100.0,
                  high=101.0,
                  low=99.0,
                  close=100.5,
                  volume=1000,
                  turnover=100500.0,
                  source="fixture",
                  turnover_source="estimated",
              )
          )
          PY
          (
            cd "$TMP_DIR"
            PYTHONPATH="$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/run_daily_cycle.py" \
              --date "$TARGET_DATE" \
              --skip-fetch \
              --config "$TMP_CONFIG"
          )
          rm -rf "$TMP_DIR"

      - name: Verify no artifacts were created
        run: |
          find data logs reports -type f 2>/dev/null | sort > /tmp/post_files.txt || true
          NEW_FILES=$(diff /tmp/pre_files.txt /tmp/post_files.txt 2>/dev/null | grep "^>" | sed 's/^> //' || true)
          if [ -n "$NEW_FILES" ]; then
            echo "ERROR: New files were created during dry-run:"
            echo "$NEW_FILES"
            exit 1
          fi
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: git status shows uncommitted changes"
            exit 1
          fi
          echo "OK: No artifacts created"
