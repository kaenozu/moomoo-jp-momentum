name: tests

on:
  pull_request:
  push:
    branches:
      - agent/release-v1.2.2

permissions:
  contents: read

jobs:
  apply-release:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/release-v1.2.2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v1.2.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install PyYAML pytest
      - name: Apply release upgrade and push
        shell: bash
        run: |
          set +e
          python scripts/_apply_release_v1_2_2.py 2>&1 | tee "$RUNNER_TEMP/release-v1.2.2-applicator.log"
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-v1.2.2-applicator-diagnostics
          path: ${{ runner.temp }}/release-v1.2.2-applicator.log
          if-no-files-found: warn
          retention-days: 7
