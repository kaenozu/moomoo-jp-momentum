name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for pre-existing artifacts
        run: |
          echo "=== git status before ==="
          git status --porcelain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run fast tests
        run: |
          set +e
          python -m pytest tests/ -m "not slow" -q > "$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pytest.log"
          exit "$status"

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: ${{ runner.temp }}/pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Parse recovery runbook PowerShell
        shell: pwsh
        run: |
          $Markdown = Get-Content -Raw docs/sqlite-backup-recovery-drill.md
          $Pattern = '(?ms)^```powershell[^\S\r\n]*\r?\n(.*?)^```[^\S\r\n]*$'
          $CodeBlocks = [regex]::Matches($Markdown, $Pattern)
          if ($CodeBlocks.Count -eq 0) {
              throw "No PowerShell blocks found in recovery runbook"
          }
          $Script = ($CodeBlocks | ForEach-Object { $_.Groups[1].Value }) -join "`n"
          $Tokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseInput(
              $Script,
              [ref]$Tokens,
              [ref]$ParseErrors
          ) | Out-Null
          if ($ParseErrors.Count -gt 0) {
              $ParseErrors | ForEach-Object { Write-Error $_.Message }
              throw "Recovery runbook contains PowerShell parse errors"
          }

      - name: Run ruff
        run: >-
          ruff check src/ tests/ run_daily_cycle.py daily_update.py
          historical_backtest.py screen_candidates.py scheduler.py
          performance_report.py database_backup.py --output-format=github

      - name: Run pyright
        run: |
          set +e
          pyright > "$RUNNER_TEMP/pyright.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pyright.log"
          exit "$status"

      - name: Upload pyright log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyright-log
          path: ${{ runner.temp }}/pyright.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Test dry-run with test config
        run: >-
          python run_daily_cycle.py --dry-run
          --config tests/fixtures/config.test.yaml

      - name: Verify no artifacts created
        if: always()
        run: |
          echo "=== git status after ==="
          git status --porcelain
          if git status --porcelain | grep -q .; then
            echo "ERROR: New files were created by the test run" >&2
            git status --porcelain
            exit 1
          fi
          test ! -e data/moomoo.db || { echo "ERROR: data/moomoo.db was created"; exit 1; }
          test ! -d logs || { echo "ERROR: logs/ was created"; exit 1; }
          test ! -d reports || { echo "ERROR: reports/ was created"; exit 1; }
          echo "OK: No artifacts created"
