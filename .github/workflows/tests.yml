name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run fast tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -m "not slow" -q 2>&1 | tee /tmp/pytest-fast.log

      - name: Upload pytest failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-fast-${{ github.run_id }}
          path: /tmp/pytest-fast.log
          if-no-files-found: error
          retention-days: 7

      - name: Run ruff
        run: ruff check --output-format=github src/ tests/ run_daily_cycle.py

      - name: Run pyright
        run: pyright

      - name: Record pre-dry-run file listing
        run: find data logs reports -type f 2>/dev/null | sort > /tmp/pre_dry_run_files.txt || true

      - name: Dry-run with test config
        run: python run_daily_cycle.py --dry-run --config tests/fixtures/config.test.yaml

      - name: Verify dry-run created no artifacts
        run: |
          find data logs reports -type f 2>/dev/null | sort > /tmp/post_dry_run_files.txt || true
          NEW_FILES=$(diff /tmp/pre_dry_run_files.txt /tmp/post_dry_run_files.txt 2>/dev/null | grep "^>" | sed 's/^> //' || true)
          if [ -n "$NEW_FILES" ]; then
            echo "ERROR: New files were created during dry-run:"
            echo "$NEW_FILES"
            exit 1
          fi
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: git status shows uncommitted changes"
            exit 1
          fi
          echo "OK: No artifacts created by dry-run"
