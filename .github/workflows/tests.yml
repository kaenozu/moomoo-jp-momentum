name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for pre-existing artifacts
        run: |
          echo "=== git status before ==="
          git status --porcelain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run fast tests
        run: |
          set +e
          python -m pytest tests/ -m "not slow" -q > "$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pytest.log"
          exit "$status"

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: ${{ runner.temp }}/pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Parse recovery drill PowerShell
        shell: pwsh
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              "scripts/sqlite_backup_recovery_drill.ps1",
              [ref]$Tokens,
              [ref]$ParseErrors
          ) | Out-Null
          if ($ParseErrors.Count -gt 0) {
              $ParseErrors | ForEach-Object { Write-Error $_.Message }
              throw "Recovery drill script contains PowerShell parse errors"
          }

      - name: Run temporary SQLite recovery drill
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Root = Join-Path $env:RUNNER_TEMP "sqlite-recovery-drill-$env:GITHUB_RUN_ID"
          $LiveDb = Join-Path $Root "live/moomoo.db"
          $Config = Join-Path $Root "config.yaml"
          $Evidence = Join-Path $Root "evidence"
          $Secondary = Join-Path $Root "secondary"
          $Restore = Join-Path $Root "restore/moomoo-restored.db"
          New-Item -ItemType Directory -Path $Root | Out-Null

          $FixtureScript = @'
          from pathlib import Path
          import sqlite3
          import sys
          import yaml
          from src.models import CREATE_TABLES_SQL

          db_path = Path(sys.argv[1]).resolve()
          config_path = Path(sys.argv[2]).resolve()
          db_path.parent.mkdir(parents=True, exist_ok=True)
          with sqlite3.connect(db_path) as connection:
              connection.execute("PRAGMA journal_mode=WAL")
              connection.executescript(CREATE_TABLES_SQL)
              connection.commit()
          payload = {
              "database": {"path": str(db_path)},
              "database_backup": {
                  "enabled": True,
                  "directory": str((config_path.parent / "production-backups").resolve()),
                  "retain_daily": 7,
                  "retain_weekly": 4,
                  "retain_pre_cycle": 7,
                  "retain_post_cycle": 7,
                  "verify_after_backup": True,
              },
              "cycle_control": {"enabled": True},
              "virtual_trade": {
                  "enabled": True,
                  "initial_cash": 150000,
                  "commission": 0,
              },
          }
          config_path.write_text(
              yaml.safe_dump(payload, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          '@
          $FixtureRaw = & python -c $FixtureScript $LiveDb $Config 2>&1
          if ($LASTEXITCODE -ne 0) { throw ($FixtureRaw -join "`n") }

          $ExpectedHead = (& git rev-parse HEAD).Trim()
          & pwsh -NoProfile -File scripts/sqlite_backup_recovery_drill.ps1 `
              -ExpectedHead $ExpectedHead `
              -ProductionConfig $Config `
              -EvidenceDir $Evidence `
              -SecondaryDir $Secondary `
              -RestorePath $Restore `
              -Strategy momentum `
              -ConfirmProductionExecution
          if ($LASTEXITCODE -ne 0) {
              throw "Temporary SQLite recovery drill failed"
          }

          $ResultPath = Join-Path $Evidence "70-final-result.json"
          if (-not (Test-Path -LiteralPath $ResultPath -PathType Leaf)) {
              throw "Recovery drill did not create final evidence"
          }
          $Result = Get-Content -Raw -LiteralPath $ResultPath | ConvertFrom-Json
          if ($Result.status -ne "pending_operator_review") {
              throw "Unexpected drill status: $($Result.status)"
          }
          if ([int]$Result.integrity_errors -ne 0) {
              throw "Temporary drill reported integrity errors"
          }
          if (-not [bool]$Result.live_state_unchanged) {
              throw "Temporary drill changed the live state"
          }
          if (-not [bool]$Result.restored_state_matches) {
              throw "Temporary drill restore did not match"
          }
          if ([int]$Result.corrupt_verify_exit_code -eq 0) {
              throw "Corrupt backup was accepted by verify"
          }
          if ([int]$Result.corrupt_restore_dry_run_exit_code -eq 0) {
              throw "Corrupt backup was accepted by restore dry-run"
          }
          if (-not (Test-Path -LiteralPath $Restore -PathType Leaf)) {
              throw "Temporary drill restore file is missing"
          }

      - name: Run ruff
        run: >-
          ruff check src/ tests/ run_daily_cycle.py daily_update.py
          historical_backtest.py screen_candidates.py scheduler.py
          performance_report.py database_backup.py --output-format=github

      - name: Run pyright
        run: |
          set +e
          pyright > "$RUNNER_TEMP/pyright.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pyright.log"
          exit "$status"

      - name: Upload pyright log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyright-log
          path: ${{ runner.temp }}/pyright.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Test dry-run with test config
        run: >-
          python run_daily_cycle.py --dry-run
          --config tests/fixtures/config.test.yaml

      - name: Verify no artifacts created
        if: always()
        run: |
          echo "=== git status after ==="
          git status --porcelain
          if git status --porcelain | grep -q .; then
            echo "ERROR: New files were created by the test run" >&2
            git status --porcelain
            exit 1
          fi
          test ! -e data/moomoo.db || { echo "ERROR: data/moomoo.db was created"; exit 1; }
          test ! -d logs || { echo "ERROR: logs/ was created"; exit 1; }
          test ! -d reports || { echo "ERROR: reports/ was created"; exit 1; }
          echo "OK: No artifacts created"

  apply-handoff:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/verified-readonly-handoff-v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verified-readonly-handoff-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repair applicator and restore workflow contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/_apply_verified_handoff_split.py')
          text = path.read_text(encoding='utf-8')

          docs_start = text.index('def patch_docs() -> None:')
          docs_end = text.index('\ndef main() -> None:', docs_start)
          docs = '''def patch_docs() -> None:
              for relative in [
                  "tools/production_discovery/handoff/README_FIRST.md",
                  "tools/production_discovery/handoff/LOCAL_AGENT_PROMPT.md",
              ]:
                  path = ROOT / relative
                  text = path.read_text(encoding="utf-8-sig").replace("\\r\\n", "\\n")
                  marker = "handoff version"
                  if marker not in text.lower():
                      text += (
                          "\\n## Version contract\\n\\n"
                          "- operator version: `1.2.2`\\n"
                          "- handoff package version: `1.2.2`\\n"
                          "- handoff format version: `1`\\n"
                          "\\nこれらは別々のversion軸です。機械検証PASSでもpreflightは承認されません。\\n"
                      )
                  path.write_text(text, encoding="utf-8", newline="\\n")
          '''
          text = text[:docs_start] + docs + text[docs_end:]

          validation_start = text.index('    run(\\n        sys.executable,')
          validation_end = text.index(
              '    run(sys.executable, "scripts/test_moomoo_readonly_discovery_handoff_builder.py", "-v")',
              validation_start,
          )
          validation = '''    run(
                  sys.executable,
                  "-m",
                  "py_compile",
                  "scripts/build_moomoo_readonly_discovery_handoff.py",
                  "scripts/compare_moomoo_readonly_discovery_handoffs.py",
                  "scripts/test_moomoo_readonly_discovery_handoff_builder.py",
                  "tools/production_discovery/handoff_test_python_shim.py",
              )
          '''
          text = text[:validation_start] + validation + text[validation_end:]

          comparer_end = '''    path.write_text(text, encoding="utf-8", newline="\\n")


def safe_extract_function'''
          comparer_replacement = '''    text = replace_once(
                  text,
                  "except (OSError, zipfile.BadZipFile) as exc:",
                  "except (OSError, ValueError, zipfile.BadZipFile) as exc:",
                  "comparer unsafe ZIP error handling",
              )
              path.write_text(text, encoding="utf-8", newline="\\n")


def safe_extract_function'''
          if comparer_end not in text:
              raise RuntimeError('Could not locate comparer function end')
          text = text.replace(comparer_end, comparer_replacement, 1)

          cleanup_marker = '(ROOT / ".github/workflows/_apply-verified-handoff-split.yml").unlink()'
          cleanup_replacement = (
              cleanup_marker
              + '\n    (ROOT / "scripts/_verified_handoff_trigger.txt").unlink()'
              + '\n    (ROOT / ".github/workflows/tests.yml").write_bytes('
              + '\n        subprocess.run('
              + '\n            ["git", "show", "origin/master:.github/workflows/tests.yml"],'
              + '\n            cwd=ROOT, check=True, stdout=subprocess.PIPE'
              + '\n        ).stdout'
              + '\n    )'
          )
          if cleanup_marker not in text:
              raise RuntimeError('Could not locate applicator cleanup block')
          text = text.replace(cleanup_marker, cleanup_replacement, 1)
          text = text.replace(
              'HEAD:agent/verified-readonly-handoff',
              'HEAD:agent/verified-readonly-handoff-v2',
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python -m py_compile scripts/_apply_verified_handoff_split.py
      - name: Apply handoff and push
        shell: bash
        run: |
          set +e
          python scripts/_apply_verified_handoff_split.py 2>&1 | tee "$RUNNER_TEMP/handoff-applicator.log"
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload applicator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-handoff-applicator-diagnostics
          path: ${{ runner.temp }}/handoff-applicator.log
          if-no-files-found: warn
          retention-days: 7
