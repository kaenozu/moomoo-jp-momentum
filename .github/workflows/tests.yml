name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Record pre-run file listing
        run: find data logs reports -type f 2>/dev/null | sort > /tmp/pre_files.txt || true

      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -q

      - name: Run ruff
        run: ruff check --output-format=github src/ tests/ run_daily_cycle.py

      - name: Run pyright
        run: pyright

      - name: Dry-run with test config
        run: python run_daily_cycle.py --dry-run --config tests/fixtures/config.test.yaml

      - name: Test skip-fetch with test config
        id: skip_fetch
        continue-on-error: true
        run: python run_daily_cycle.py --date 2026-07-10 --skip-fetch --config tests/fixtures/config.test.yaml > /tmp/skip-fetch.log 2>&1

      - name: Upload skip-fetch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skip-fetch-diagnostics
          path: /tmp/skip-fetch.log

      - name: Fail on skip-fetch error
        if: steps.skip_fetch.outcome == 'failure'
        run: exit 1

      - name: Verify no artifacts were created
        run: |
          find data logs reports -type f 2>/dev/null | sort > /tmp/post_files.txt || true
          NEW_FILES=$(diff /tmp/pre_files.txt /tmp/post_files.txt 2>/dev/null | grep "^>" | sed 's/^> //' || true)
          if [ -n "$NEW_FILES" ]; then
            echo "ERROR: New files were created during dry-run:"
            echo "$NEW_FILES"
            exit 1
          fi
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: git status shows uncommitted changes"
            exit 1
          fi
          echo "OK: No artifacts created"
