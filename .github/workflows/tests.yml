name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for pre-existing artifacts
        run: |
          echo "=== git status before ==="
          git status --porcelain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run fast tests
        run: |
          set +e
          python -m pytest tests/ -m "not slow" -q > "$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pytest.log"
          exit "$status"

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: ${{ runner.temp }}/pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Parse recovery drill PowerShell
        shell: pwsh
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              "scripts/sqlite_backup_recovery_drill.ps1",
              [ref]$Tokens,
              [ref]$ParseErrors
          ) | Out-Null
          if ($ParseErrors.Count -gt 0) {
              $ParseErrors | ForEach-Object { Write-Error $_.Message }
              throw "Recovery drill script contains PowerShell parse errors"
          }

      - name: Run temporary SQLite recovery drill
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Root = Join-Path $env:RUNNER_TEMP "sqlite-recovery-drill-$env:GITHUB_RUN_ID"
          $LiveDb = Join-Path $Root "live/moomoo.db"
          $Config = Join-Path $Root "config.yaml"
          $Evidence = Join-Path $Root "evidence"
          $Secondary = Join-Path $Root "secondary"
          $Restore = Join-Path $Root "restore/moomoo-restored.db"
          New-Item -ItemType Directory -Path $Root | Out-Null

          $FixtureScript = @'
          from pathlib import Path
          import sqlite3
          import sys
          import yaml
          from src.models import CREATE_TABLES_SQL

          db_path = Path(sys.argv[1]).resolve()
          config_path = Path(sys.argv[2]).resolve()
          db_path.parent.mkdir(parents=True, exist_ok=True)
          with sqlite3.connect(db_path) as connection:
              connection.execute("PRAGMA journal_mode=WAL")
              connection.executescript(CREATE_TABLES_SQL)
              connection.commit()
          payload = {
              "database": {"path": str(db_path)},
              "database_backup": {
                  "enabled": True,
                  "directory": str((config_path.parent / "production-backups").resolve()),
                  "retain_daily": 7,
                  "retain_weekly": 4,
                  "retain_pre_cycle": 7,
                  "retain_post_cycle": 7,
                  "verify_after_backup": True,
              },
              "cycle_control": {"enabled": True},
              "virtual_trade": {
                  "enabled": True,
                  "initial_cash": 150000,
                  "commission": 0,
              },
          }
          config_path.write_text(
              yaml.safe_dump(payload, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          '@
          $FixtureRaw = & python -c $FixtureScript $LiveDb $Config 2>&1
          if ($LASTEXITCODE -ne 0) { throw ($FixtureRaw -join "`n") }

          $ExpectedHead = (& git rev-parse HEAD).Trim()
          & pwsh -NoProfile -File scripts/sqlite_backup_recovery_drill.ps1 `
              -ExpectedHead $ExpectedHead `
              -ProductionConfig $Config `
              -EvidenceDir $Evidence `
              -SecondaryDir $Secondary `
              -RestorePath $Restore `
              -Strategy momentum `
              -ConfirmProductionExecution
          if ($LASTEXITCODE -ne 0) {
              throw "Temporary SQLite recovery drill failed"
          }

          $ResultPath = Join-Path $Evidence "70-final-result.json"
          if (-not (Test-Path -LiteralPath $ResultPath -PathType Leaf)) {
              throw "Recovery drill did not create final evidence"
          }
          $Result = Get-Content -Raw -LiteralPath $ResultPath | ConvertFrom-Json
          if ($Result.status -ne "pending_operator_review") {
              throw "Unexpected drill status: $($Result.status)"
          }
          if ([int]$Result.integrity_errors -ne 0) {
              throw "Temporary drill reported integrity errors"
          }
          if (-not [bool]$Result.live_state_unchanged) {
              throw "Temporary drill changed the live state"
          }
          if (-not [bool]$Result.restored_state_matches) {
              throw "Temporary drill restore did not match"
          }
          if ([int]$Result.corrupt_verify_exit_code -eq 0) {
              throw "Corrupt backup was accepted by verify"
          }
          if ([int]$Result.corrupt_restore_dry_run_exit_code -eq 0) {
              throw "Corrupt backup was accepted by restore dry-run"
          }
          if (-not (Test-Path -LiteralPath $Restore -PathType Leaf)) {
              throw "Temporary drill restore file is missing"
          }

      - name: Run ruff
        run: >-
          ruff check src/ tests/ run_daily_cycle.py daily_update.py
          historical_backtest.py screen_candidates.py scheduler.py
          performance_report.py database_backup.py --output-format=github

      - name: Run pyright
        run: |
          set +e
          pyright > "$RUNNER_TEMP/pyright.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pyright.log"
          exit "$status"

      - name: Upload pyright log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyright-log
          path: ${{ runner.temp }}/pyright.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Test dry-run with test config
        run: >-
          python run_daily_cycle.py --dry-run
          --config tests/fixtures/config.test.yaml

      - name: Verify no artifacts created
        if: always()
        run: |
          echo "=== git status after ==="
          git status --porcelain
          if git status --porcelain | grep -q .; then
            echo "ERROR: New files were created by the test run" >&2
            git status --porcelain
            exit 1
          fi
          test ! -e data/moomoo.db || { echo "ERROR: data/moomoo.db was created"; exit 1; }
          test ! -d logs || { echo "ERROR: logs/ was created"; exit 1; }
          test ! -d reports || { echo "ERROR: reports/ was created"; exit 1; }
          echo "OK: No artifacts created"

  windows-recovery-drill:
    name: Windows recovery drill (${{ matrix.display_name }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: Windows PowerShell 5.1
            shell: powershell
            executable: powershell
            case_name: windows-powershell-5
          - display_name: PowerShell 7
            shell: pwsh
            executable: pwsh
            case_name: powershell-7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        shell: ${{ matrix.shell }}
        run: python -m pip install -r requirements.txt

      - name: Verify selected PowerShell
        shell: ${{ matrix.shell }}
        run: |
          $Version = $PSVersionTable.PSVersion
          Write-Host "PSEdition=$($PSVersionTable.PSEdition) Version=$Version"
          if ("${{ matrix.executable }}" -eq "powershell" -and $Version.Major -ne 5) {
              throw "Expected Windows PowerShell 5.x, got $Version"
          }
          if ("${{ matrix.executable }}" -eq "pwsh" -and $Version.Major -lt 7) {
              throw "Expected PowerShell 7+, got $Version"
          }

      - name: Parse production drill script
        shell: ${{ matrix.shell }}
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              "scripts/sqlite_backup_recovery_drill.ps1",
              [ref]$Tokens,
              [ref]$ParseErrors
          ) | Out-Null
          if ($ParseErrors.Count -gt 0) {
              $ParseErrors | ForEach-Object { Write-Error $_.Message }
              throw "Production recovery drill contains parse errors"
          }

          $HarnessTokens = $null
          $HarnessErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              "tests/run_database_backup_drill_windows.ps1",
              [ref]$HarnessTokens,
              [ref]$HarnessErrors
          ) | Out-Null
          if ($HarnessErrors.Count -gt 0) {
              $HarnessErrors | ForEach-Object { Write-Error $_.Message }
              throw "Windows recovery test harness contains parse errors"
          }

      - name: Run Windows recovery drill guards and full simulation
        shell: ${{ matrix.shell }}
        run: |
          $LogPath = Join-Path $env:RUNNER_TEMP (
              "windows-recovery-${{ matrix.case_name }}.log"
          )
          $Raw = & "${{ matrix.executable }}" -NoProfile -NonInteractive `
              -ExecutionPolicy Bypass `
              -File tests/run_database_backup_drill_windows.ps1 `
              -ShellExecutable "${{ matrix.executable }}" `
              -CaseName "${{ matrix.case_name }}" 2>&1
          $ExitCode = $LASTEXITCODE
          $Raw | Set-Content -Encoding utf8 -LiteralPath $LogPath
          $Raw | ForEach-Object { Write-Host $_ }
          if ($ExitCode -ne 0) {
              throw "Windows recovery drill failed with exit code $ExitCode"
          }

      - name: Verify no repository artifacts
        if: always()
        shell: ${{ matrix.shell }}
        run: |
          $Status = & git status --porcelain
          if ($LASTEXITCODE -ne 0) {
              throw "Could not read git status"
          }
          if ($Status) {
              $Status | ForEach-Object { Write-Error $_ }
              throw "Windows recovery drill created repository artifacts"
          }

      - name: Upload Windows drill diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-recovery-${{ matrix.case_name }}
          path: |
            ${{ runner.temp }}/windows-recovery-${{ matrix.case_name }}.log
            ${{ runner.temp }}/sqlite recovery drill *
          if-no-files-found: warn
          retention-days: 3
