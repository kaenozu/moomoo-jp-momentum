name: tests

on:
  push:
  pull_request:

jobs:
  apply-position-history-completeness-fix:
    if: >-
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'push' && github.ref_name == 'fix/virtual-positions-as-of-date') ||
       (github.event_name == 'pull_request' && github.head_ref == 'fix/virtual-positions-as-of-date'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/virtual-positions-as-of-date
          fetch-depth: 0

      - name: Apply cache completeness guard
        run: python .agent_fix_position_history_completeness.py

      - name: Restore workflow and commit fix
        run: |
          git checkout origin/master -- .github/workflows/tests.yml
          git rm .agent_fix_position_history_completeness.py
          git add src/virtual_trade.py tests/test_virtual_trade_position_history.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: guard mixed legacy position caches"
          git push origin HEAD:fix/virtual-positions-as-of-date

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for pre-existing artifacts
        run: |
          echo "=== git status before ==="
          git status --porcelain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -q

      - name: Run ruff
        run: >-
          ruff check src/ tests/ run_daily_cycle.py daily_update.py
          historical_backtest.py screen_candidates.py scheduler.py
          performance_report.py --output-format=github

      - name: Run pyright
        run: |
          set +e
          pyright > "$RUNNER_TEMP/pyright.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pyright.log"
          exit "$status"

      - name: Upload pyright log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyright-log
          path: ${{ runner.temp }}/pyright.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Test dry-run with test config
        run: >-
          python run_daily_cycle.py --dry-run
          --config tests/fixtures/config.test.yaml

      - name: Verify no artifacts created
        if: always()
        run: |
          echo "=== git status after ==="
          git status --porcelain
          if git status --porcelain | grep -q .; then
            echo "ERROR: New files were created by the test run" >&2
            git status --porcelain
            exit 1
          fi
          test ! -e data/moomoo.db || { echo "ERROR: data/moomoo.db was created"; exit 1; }
          test ! -d logs || { echo "ERROR: logs/ was created"; exit 1; }
          test ! -d reports || { echo "ERROR: reports/ was created"; exit 1; }
          echo "OK: No artifacts created"
