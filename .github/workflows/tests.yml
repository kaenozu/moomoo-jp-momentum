name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-cash-pyright-fix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/virtual-cash-from-fills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/virtual-cash-from-fills
          fetch-depth: 0
      - name: Apply cash Pyright fix
        run: python .agent_fix_cash_pyright.py
      - name: Commit Pyright fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_virtual_trade_cash_history.py .github/workflows/tests.yml
          git add -u .agent_fix_cash_pyright.py .agent_original_tests.yml
          git commit -m "test: type cash replay wrapper precisely"
          git push origin HEAD:fix/virtual-cash-from-fills
