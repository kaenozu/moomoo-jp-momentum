name: Temporary Scoped Pyright Diagnostics

on:
  push:
    branches:
      - fix/pyright-test-type-errors

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/pyright-test-type-errors
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install development dependencies
        shell: bash
        run: |
          uv venv
          uv pip install -r requirements-dev.txt

      - name: Run scoped Pyright command and record output
        shell: bash
        run: |
          set +e
          uv run pyright run_daily_cycle.py src/virtual_trade.py src/config.py tests/ > .pyright-scoped-output.txt 2>&1
          status=$?
          cat .pyright-scoped-output.txt
          printf '\nexit_code=%s\n' "$status" >> .pyright-scoped-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pyright-scoped-output.txt
          git commit -m "ci: record scoped pyright diagnostics"
          git push origin HEAD:fix/pyright-test-type-errors
          exit "$status"
