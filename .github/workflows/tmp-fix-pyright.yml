name: Temporary Exact Pyright Validation

on:
  push:
    branches:
      - fix/pyright-test-type-errors

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/pyright-test-type-errors
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install development dependencies
        shell: bash
        run: |
          uv venv
          uv pip install -r requirements-dev.txt

      - name: Run exact Pyright command
        shell: bash
        run: uv run pyright

      - name: Record successful validation
        shell: bash
        run: |
          printf 'uv run pyright: 0 errors\n' > .pyright-validation-ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pyright-validation-ok
          git commit -m "ci: record exact pyright validation"
          git push origin HEAD:fix/pyright-test-type-errors
