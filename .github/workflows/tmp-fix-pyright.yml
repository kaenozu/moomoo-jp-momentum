name: Temporary Pyright Test Core Fix

on:
  push:
    branches:
      - fix/pyright-test-type-errors

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/pyright-test-type-errors
          fetch-depth: 0

      - name: Patch skipped get_available_cash assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_core.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'available = vtm.get_available_cash("default")':
                  'available = vtm.get_available_cash("default")  # type: ignore[attr-defined]',
              'assert vtm.get_available_cash("default") == 39800.0':
                  'assert vtm.get_available_cash("default") == 39800.0  # type: ignore[attr-defined]',
              'assert vtm2.get_available_cash("default") == 39500.0':
                  'assert vtm2.get_available_cash("default") == 39500.0  # type: ignore[attr-defined]',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Unexpected match count for {old!r}: {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_core.py
          git commit -m "fix: suppress unavailable API checks in skipped tests"
          git push origin HEAD:fix/pyright-test-type-errors
