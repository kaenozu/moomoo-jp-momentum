name: apply-pr22-review-fix

on:
  push:
    branches:
      - fix/daily-cycle-integrity-gate
    paths:
      - scripts/apply_pr22_review_fix.py
      - .github/workflows/apply-pr22-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-cycle-integrity-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply review fix
        run: python scripts/apply_pr22_review_fix.py
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: reuse validated virtual trade setting"
          git push origin HEAD:fix/daily-cycle-integrity-gate
