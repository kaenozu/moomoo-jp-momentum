name: publish moomoo master artifact status

on:
  workflow_run:
    workflows:
      - moomoo discovery master-bound release
      - moomoo handoff Windows validation
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  publish-master-release-status:
    name: Publish master artifact commit status
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish run URL and conclusion
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const succeeded = run.conclusion === 'success';
            const isHandoff =
              run.name === 'moomoo handoff Windows validation';
            const statusContext = isHandoff
              ? 'moomoo/master-handoff'
              : 'moomoo/master-release';
            const successDescription = isHandoff
              ? 'Master handoff built and cross-shell verified'
              : 'Master release candidate built and cross-shell verified';
            const failureDescription = isHandoff
              ? 'Master handoff validation failed; inspect workflow run'
              : 'Master release validation failed; inspect workflow run';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: run.head_sha,
              state: succeeded ? 'success' : 'failure',
              target_url: run.html_url,
              context: statusContext,
              description: succeeded
                ? successDescription
                : failureDescription,
            });
            core.info(
              `Published ${succeeded ? 'success' : 'failure'} ` +
              `${statusContext} for ${run.head_sha} from run ${run.id}`
            );
