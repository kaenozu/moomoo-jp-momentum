name: publish moomoo master release status

on:
  workflow_run:
    workflows:
      - moomoo discovery master-bound release
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  publish-master-release-status:
    name: Publish master release commit status
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish run URL and conclusion
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const succeeded = run.conclusion === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: run.head_sha,
              state: succeeded ? 'success' : 'failure',
              target_url: run.html_url,
              context: 'moomoo/master-release',
              description: succeeded
                ? 'Master release candidate built and cross-shell verified'
                : 'Master release validation failed; inspect workflow run',
            });
            core.info(
              `Published ${succeeded ? 'success' : 'failure'} for ` +
              `${run.head_sha} from run ${run.id}`
            );
