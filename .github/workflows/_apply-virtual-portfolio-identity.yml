name: temporary virtual portfolio identity applicator

on:
  push:
    branches:
      - agent/virtual-portfolio-identity
    paths:
      - scripts/_apply_virtual_portfolio_identity.py
      - .github/workflows/_apply-virtual-portfolio-identity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/virtual-portfolio-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Apply and validate identity split
        id: apply
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/virtual-portfolio-applicator.log"
          {
            python scripts/_apply_virtual_portfolio_identity.py
            python -m py_compile \
              src/trading_identity.py \
              src/signals.py \
              src/virtual_trade_integrity.py \
              src/database_backup.py \
              run_daily_cycle.py \
              virtual_order.py \
              database_backup.py \
              tests/test_virtual_portfolio_identity.py \
              tests/test_database_backup_drill.py
            python -m pytest -q \
              tests/test_virtual_portfolio_identity.py \
              tests/test_database_backup.py \
              tests/test_database_backup_drill.py \
              tests/test_daily_cycle.py \
              tests/test_daily_cycle_integrity.py
            ruff check \
              src/trading_identity.py \
              src/signals.py \
              src/virtual_trade_integrity.py \
              src/database_backup.py \
              run_daily_cycle.py \
              virtual_order.py \
              database_backup.py \
              tests/test_virtual_portfolio_identity.py \
              tests/test_database_backup_drill.py
            pyright
            pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/sqlite_backup_recovery_drill.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
            pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tests/run_database_backup_drill_windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
            git diff --check
          } >"$LOG" 2>&1
          CODE=$?
          cat "$LOG"
          if [[ $CODE -ne 0 ]]; then
            git reset --hard HEAD
            git clean -fd
            cp "$LOG" scripts/_virtual_portfolio_apply_diagnostics.txt
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Commit generated patch or diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.apply.outputs.failed }}" == "true" ]]; then
            git add scripts/_virtual_portfolio_apply_diagnostics.txt
            git commit -m "chore: record portfolio applicator failure"
          else
            git add \
              src/trading_identity.py \
              src/signals.py \
              run_daily_cycle.py \
              virtual_order.py \
              app.py \
              database_backup.py \
              src/database_backup.py \
              src/virtual_trade_integrity.py \
              scripts/sqlite_backup_recovery_drill.ps1 \
              config.example.yaml \
              README.md \
              tests/test_database_backup_drill.py \
              tests/run_database_backup_drill_windows.ps1 \
              tests/test_virtual_portfolio_identity.py \
              .github/workflows/tests.yml \
              pyrightconfig.json
            git commit -m "fix: separate signal strategy from virtual portfolio"
          fi
          git push origin HEAD:agent/virtual-portfolio-identity
      - name: Fail after retaining diagnostics
        if: steps.apply.outputs.failed == 'true'
        run: exit 1
