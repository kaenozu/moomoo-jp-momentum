name: temporary apply PR40 review fixes

on:
  push:
    branches:
      - agent/issue-27-discovery-gates
    paths:
      - scripts/_apply_pr40_review_fixes.py
      - .github/workflows/_apply-pr40-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-27-discovery-gates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply, validate, and commit review fixes
        run: |
          python scripts/_apply_pr40_review_fixes.py
          python -m py_compile \
            scripts/verify_moomoo_master_handoff_offline.py \
            scripts/test_verify_moomoo_master_handoff_offline.py
          python scripts/test_verify_moomoo_master_handoff_offline.py -v
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/verify_moomoo_master_handoff_offline.py \
            scripts/test_verify_moomoo_master_handoff_offline.py
          git commit -m "fix: address offline verifier review findings"
          git push origin HEAD:agent/issue-27-discovery-gates
