name: apply final recovery review fixes visible

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.head_ref == 'agent/sqlite-backup-recovery-drill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sqlite-backup-recovery-drill
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Execute deterministic patch embedded in the staged workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-final-review-fixes.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          code = textwrap.dedent(source[start:end])
          exec(compile(code, 'apply-final-review-fixes.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Validate focused tests and PowerShell syntax
        run: |
          python -m pytest tests/test_virtual_trade_integrity_connection.py tests/test_database_backup_drill.py -q
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/sqlite_backup_recovery_drill.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tests/run_database_backup_drill_windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'

      - name: Commit fixes and remove one-time workflows
        run: |
          git rm .github/workflows/apply-final-review-fixes.yml .github/workflows/apply-final-review-fixes-runner.yml .github/workflows/apply-final-review-fixes-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sqlite_backup_recovery_drill.ps1 tests/run_database_backup_drill_windows.ps1 .github/workflows/windows-recovery-drill.yml docs/sqlite-backup-recovery-drill.md
          git commit -m "fix: anchor recovery drill to repository root"
          git push origin HEAD:agent/sqlite-backup-recovery-drill
