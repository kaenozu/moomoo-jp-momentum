name: trigger regime overlay implementation

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/regime-overlay-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Apply implementation
        run: python .github/apply_regime_overlay.py

      - name: Test regime detector
        run: python -m pytest tests/test_regime_detector.py -q

      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -q

      - name: Run Ruff
        run: ruff check src/ tests/ run_daily_cycle.py

      - name: Run Pyright
        run: pyright

      - name: Compile and inspect diff
        run: |
          python -m compileall -q src
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add regime-aware idle cash overlay"
          git push origin HEAD:master
