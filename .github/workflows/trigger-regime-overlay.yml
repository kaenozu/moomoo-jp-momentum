name: trigger regime overlay implementation

on:
  pull_request_target:
    types:
      - opened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/regime-overlay-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply embedded implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path(".github/workflows/apply-regime-overlay.yml")
          lines = workflow_path.read_text(encoding="utf-8").splitlines()
          start = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == "python - <<'PY'"
          )
          end = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index].strip() == "PY"
          )
          code = textwrap.dedent("\n".join(lines[start + 1:end]))
          exec(compile(code, str(workflow_path), "exec"))
          Path(".github/workflows/trigger-regime-overlay.yml").unlink()
          PY

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate implementation
        run: |
          python -m pytest tests/test_regime_detector.py -q
          python -m pytest tests/ -m "not slow" -q
          ruff check src/ tests/ run_daily_cycle.py
          pyright
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml config.example.yaml src/backtest_runner.py src/regime_detector.py src/models.py src/data_store.py tests/test_regime_detector.py .github/workflows/apply-regime-overlay.yml .github/workflows/trigger-regime-overlay.yml
          git commit -m "feat: add regime-aware idle cash overlay"
          git push origin HEAD:master
