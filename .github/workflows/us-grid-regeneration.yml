name: US grid research regeneration

on:
  workflow_dispatch:
  push:
    branches:
      - agent/us-adaptive-grid-research
    paths:
      - .github/workflows/us-grid-regeneration.yml

permissions:
  contents: read

concurrency:
  group: us-grid-regeneration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: regenerate-validation-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOCK_SOURCE_SHA: 62dd4b09219bf391364d9bd55976e4d18de75afc
      START_DATE: "2018-01-01"
      END_DATE: "2026-07-31"
      EVIDENCE_DIR: artifacts/evidence
      LOG_DIR: artifacts/logs
      RESULT_DIR: artifacts/results
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Prepare exact locked environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$LOG_DIR" "$RESULT_DIR" constraints
          git fetch --no-tags --depth=1 origin "$LOCK_SOURCE_SHA"
          git show "$LOCK_SOURCE_SHA:constraints/py311.txt" > constraints/py311.txt
          git show "$LOCK_SOURCE_SHA:scripts/verify_locked_requirements.py" \
            > scripts/verify_locked_requirements.py
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install \
            --constraint constraints/py311.txt \
            --requirement requirements.txt \
            --requirement requirements-dev.txt
          python -m pip check
          python scripts/verify_locked_requirements.py
          python --version > "$EVIDENCE_DIR/python-version.txt"
          python -m pip freeze --exclude pip --exclude setuptools --exclude wheel \
            > "$EVIDENCE_DIR/pip-freeze.txt"
          cp constraints/py311.txt "$EVIDENCE_DIR/constraints-py311.txt"

      - name: Build validation-only research config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          source = Path("config.us_grid.example.yaml")
          target = Path("artifacts/evidence/config.us_grid.validation.yaml")
          config = yaml.safe_load(source.read_text(encoding="utf-8"))
          section = config["us_grid"]
          section["enabled"] = True
          section["mode"] = "backtest"
          section["symbols"] = [
              "US.SPY",
              "US.QQQ",
              "US.IWM",
              "US.DIA",
              "US.TLT",
          ]
          section["capital_jpy"] = 300000
          section["data_dir"] = "data/us_grid"
          target.write_text(
              yaml.safe_dump(config, sort_keys=False),
              encoding="utf-8",
          )
          PY
          python scripts/run_us_grid_backtest.py \
            --config "$EVIDENCE_DIR/config.us_grid.validation.yaml" \
            --validate-only

      - name: Explicitly fetch canonical market data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/us_grid
          python scripts/run_us_grid_backtest.py \
            --config "$EVIDENCE_DIR/config.us_grid.validation.yaml" \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --fetch-data \
            --report-dir "$RESULT_DIR/baseline" \
            --json | tee "$LOG_DIR/baseline.json"

      - name: Verify canonical cache and source coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import pandas as pd

          from src.us_grid.data import load_or_fetch
          from src.us_grid.data_v2 import PRICE_BASIS

          symbols = ["US.SPY", "US.QQQ", "US.IWM", "US.DIA", "US.TLT"]
          missing = []
          cache_hashes = {}
          for symbol in symbols:
              ticker = symbol.removeprefix("US.")
              path = Path("data/us_grid") / f"{ticker}.csv"
              if not path.exists() or path.stat().st_size == 0:
                  missing.append(symbol)
                  continue
              frame = pd.read_csv(path)
              bases = {str(value) for value in frame["price_basis"].dropna().unique()}
              if bases != {PRICE_BASIS}:
                  raise SystemExit(f"invalid price basis for {symbol}: {sorted(bases)}")
              cache_hashes[symbol] = hashlib.sha256(path.read_bytes()).hexdigest()
          if missing:
              raise SystemExit(f"missing canonical data: {missing}")

          bundle = load_or_fetch(
              symbols,
              "2018-01-01",
              "2026-07-31",
              "data/us_grid",
              fetch=False,
          )
          evidence = {
              "classification": "VALIDATION_ONLY_PREMERGE_RESEARCH",
              "production_authority": False,
              "real_order_authorized": False,
              "simulate_order_authorized": False,
              "source_commit": __import__("subprocess").check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "lock_source_commit": "62dd4b09219bf391364d9bd55976e4d18de75afc",
              "price_basis": PRICE_BASIS,
              "data_hash": bundle.data_hash,
              "symbols": symbols,
              "start_date": "2018-01-01",
              "end_date": "2026-07-31",
              "cache_sha256": cache_hashes,
              "sources": bundle.sources,
          }
          Path("artifacts/evidence/data-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run complete research matrix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_us_grid_experiments.py \
            | tee "$LOG_DIR/experiments.log"
          python scripts/run_us_grid_core_hybrid.py \
            | tee "$LOG_DIR/core-hybrid.log"
          python scripts/run_us_grid_atr_sensitivity.py \
            | tee "$LOG_DIR/atr-sensitivity.log"
          python scripts/run_us_grid_cost_sensitivity.py \
            | tee "$LOG_DIR/cost-sensitivity.log"
          python scripts/run_us_grid_capital_experiment.py \
            | tee "$LOG_DIR/capital.log"
          python scripts/run_us_grid_adverse.py \
            | tee "$LOG_DIR/adverse.log"
          python scripts/run_us_grid_backtest.py \
            --config "$EVIDENCE_DIR/config.us_grid.validation.yaml" \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --walk-forward \
            --report-dir "$RESULT_DIR/walk-forward" \
            --json | tee "$LOG_DIR/walk-forward.json"

      - name: Collect results and cryptographic evidence
        shell: bash
        run: |
          set -euo pipefail
          cp reports/us_grid_*.csv "$RESULT_DIR/"
          cp -R data/us_grid "$RESULT_DIR/canonical-data"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts")
          hashes = {}
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS.json":
                  hashes[path.relative_to(root).as_posix()] = hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()
          (root / "SHA256SUMS.json").write_text(
              json.dumps(hashes, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          find artifacts -type f -print | sort

      - name: Upload validation-only research evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: us-grid-validation-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
