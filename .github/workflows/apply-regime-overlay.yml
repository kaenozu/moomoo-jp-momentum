name: apply regime overlay implementation

on:
  push:
    branches:
      - agent/regime-etf-overlay

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regime-etf-overlay
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"patch target not found: {path}: {old[:80]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")


          replace_once(
              "config.yaml",
              '    benchmark_code: "JP.1306"   # 配分先ベンチマーク\n',
              '''    benchmark_code: "JP.1306"   # 配分先ベンチマーク
              regime:
                enabled: false  # デフォルト無効（後方互換）
                signal_code: "JP.1306"
                short_window: 50
                long_window: 200
                active_regimes: ["bull"]
          ''',
          )

          replace_once(
              "config.example.yaml",
              '    benchmark_code: "JP.1306"\n',
              '''    benchmark_code: "JP.1306"
              regime:
                enabled: false  # デフォルト無効（後方互換）
                signal_code: "JP.1306"
                short_window: 50
                long_window: 200
                active_regimes: ["bull"]
          ''',
          )

          Path("src/regime_detector.py").write_text(
              '''"""
          相場レジーム検出モジュール

          ファイルパス: src/regime_detector.py
          何をするか: SMA短期・長期線からbull/bear/rangeを判定する
          なぜ存在するか: idle cash ETFオーバーレイを相場環境に連動させるため
          関連ファイル: src/backtest_runner.py, config.yaml
          """

          from typing import Optional

          import pandas as pd

          from .config import Config


          class RegimeDetector:
              """終値と移動平均から相場レジームを判定する。"""

              def __init__(self, config: Config):
                  cfg = config.get("backtest.idle_cash_allocation.regime", {})
                  self.enabled = bool(cfg.get("enabled", False))
                  self.signal_code = str(cfg.get("signal_code", "JP.1306"))
                  self.short_window = int(cfg.get("short_window", 50))
                  self.long_window = int(cfg.get("long_window", 200))
                  self.active_regimes = [
                      str(regime) for regime in cfg.get("active_regimes", ["bull"])
                  ]

              def detect(self, df: pd.DataFrame) -> list[dict]:
                  """日付順のレジーム系列を返す。"""
                  if df.empty:
                      return []

                  required_columns = {"date", "close"}
                  missing = required_columns.difference(df.columns)
                  if missing:
                      raise ValueError(
                          "レジーム判定に必要な列がありません: "
                          + ", ".join(sorted(missing))
                      )

                  data = df.copy().sort_values("date").reset_index(drop=True)
                  data["sma_short"] = data["close"].rolling(
                      window=self.short_window,
                      min_periods=self.short_window,
                  ).mean()
                  data["sma_long"] = data["close"].rolling(
                      window=self.long_window,
                      min_periods=self.long_window,
                  ).mean()

                  results: list[dict] = []
                  for _, row in data.iterrows():
                      close = row["close"]
                      sma_short = row["sma_short"]
                      sma_long = row["sma_long"]
                      date = str(row["date"])[:10]

                      if pd.isna(close) or pd.isna(sma_short) or pd.isna(sma_long):
                          results.append(
                              {
                                  "date": date,
                                  "regime": "unknown",
                                  "sma50": None,
                                  "sma200": None,
                              }
                          )
                          continue

                      if close > sma_long and sma_short > sma_long:
                          regime = "bull"
                      elif close < sma_long and sma_short < sma_long:
                          regime = "bear"
                      else:
                          regime = "range"

                      results.append(
                          {
                              "date": date,
                              "regime": regime,
                              "sma50": round(float(sma_short), 2),
                              "sma200": round(float(sma_long), 2),
                          }
                      )

                  return results

              def regime_on(self, date: str, regimes: list[dict]) -> Optional[str]:
                  """指定日の1営業日前のレジームを返し、先読みを防止する。"""
                  for index, result in enumerate(regimes):
                      if result["date"] != date:
                          continue
                      if index == 0:
                          return None
                      return str(regimes[index - 1]["regime"])
                  return None

              def is_overlay_active(self, regime: Optional[str]) -> bool:
                  """設定上オーバーレイを適用すべきレジームか判定する。"""
                  if not self.enabled or regime is None:
                      return False
                  return regime in self.active_regimes
          ''',
              encoding="utf-8",
          )

          replace_once(
              "src/backtest_runner.py",
              "from .ranking import sort_items_by_score\n",
              "from .ranking import sort_items_by_score\nfrom .regime_detector import RegimeDetector\n",
          )

          replace_once(
              "src/backtest_runner.py",
              '''    def _idle_cash_benchmark_code(self) -> Optional[str]:
                  cfg = self.config.get("backtest.idle_cash_allocation", {})
                  if cfg.get("enabled", False):
                      return cfg.get("benchmark_code", self._benchmark_code())
                  return None

              def _conn(self):
          ''',
              '''    def _idle_cash_benchmark_code(self) -> Optional[str]:
                  cfg = self.config.get("backtest.idle_cash_allocation", {})
                  if cfg.get("enabled", False):
                      return cfg.get("benchmark_code", self._benchmark_code())
                  return None

              def _ensure_market_regime_column(self) -> None:
                  """既存DBのequity curveへmarket_regime列を追加する。"""
                  with self._conn() as conn:
                      columns = {
                          row[1]
                          for row in conn.execute(
                              "PRAGMA table_info(backtest_equity_curve)"
                          ).fetchall()
                      }
                      if "market_regime" not in columns:
                          conn.execute(
                              "ALTER TABLE backtest_equity_curve "
                              "ADD COLUMN market_regime TEXT"
                          )

              def _conn(self):
          ''',
          )

          replace_once(
              "src/backtest_runner.py",
              '''        self.strategy_name = strategy_name
                  self.cash = self.initial_cash
                  self.reserved_cash = 0.0  # pending BUY予約額（signal日で増加、fill日で解放）
                  run_id = self.create_run(strategy_name, start_date, end_date)
          ''',
              '''        self.strategy_name = strategy_name
                  self.cash = self.initial_cash
                  self.reserved_cash = 0.0  # pending BUY予約額（signal日で増加、fill日で解放）
                  self._ensure_market_regime_column()
                  run_id = self.create_run(strategy_name, start_date, end_date)
          ''',
          )

          replace_once(
              "src/backtest_runner.py",
              '''        # Idle cash allocation tracking
                  idle_code = self._idle_cash_benchmark_code()
                  idle_bench_prev = None
          ''',
              '''        # Idle cash allocation tracking
                  idle_code = self._idle_cash_benchmark_code()
                  idle_bench_prev = None
                  regime_detector = RegimeDetector(self.config)
                  regimes: list[dict] = []
                  if idle_code and regime_detector.enabled:
                      history_limit = max(
                          250,
                          len(days) + regime_detector.long_window + 1,
                      )
                      regime_df = self._bars_up_to(
                          regime_detector.signal_code,
                          end_date,
                          limit=history_limit,
                      )
                      if not regime_df.empty:
                          regime_df = regime_df.rename(columns={"time_key": "date"})
                          regimes = regime_detector.detect(regime_df[["date", "close"]])
                      if not regimes:
                          logger.warning(
                              "regime signal data missing: code=%s; idle cash overlay stays inactive",
                              regime_detector.signal_code,
                          )
          ''',
          )

          replace_once(
              "src/backtest_runner.py",
              '''            # ── Phase 4: idle cash allocation ──
                  if idle_code:
                      bm_today = self._benchmark_value(idle_code, day)
                      if bm_today is not None and idle_bench_prev is not None:
                          daily_bm_ret = (bm_today - idle_bench_prev) / idle_bench_prev
                          investable_idle_cash = max(0.0, self.cash - self.reserved_cash)
                          self.cash += investable_idle_cash * daily_bm_ret
                      idle_bench_prev = bm_today
          ''',
              '''            # ── Phase 4: idle cash allocation ──
                  market_regime = regime_detector.regime_on(day, regimes) if regimes else None
                  if idle_code:
                      bm_today = self._benchmark_value(idle_code, day)
                      overlay_active = (
                          not regime_detector.enabled
                          or regime_detector.is_overlay_active(market_regime)
                      )
                      if (
                          overlay_active
                          and bm_today is not None
                          and idle_bench_prev is not None
                          and idle_bench_prev != 0
                      ):
                          daily_bm_ret = (bm_today - idle_bench_prev) / idle_bench_prev
                          investable_idle_cash = max(0.0, self.cash - self.reserved_cash)
                          self.cash += investable_idle_cash * daily_bm_ret
                      idle_bench_prev = bm_today
          ''',
          )

          replace_once(
              "src/backtest_runner.py",
              '''                    "INSERT OR REPLACE INTO backtest_equity_curve (run_id, strategy_name, date, cash, position_value, total_equity, benchmark_2559_value, benchmark_1306_value, drawdown_pct) VALUES (?,?,?,?,?,?,?,?,?)",
                          (self.run_id, strategy_name, day, self.cash, pos_value, total_equity, bm_2559, bm_1306, drawdown),
          ''',
              '''                    "INSERT OR REPLACE INTO backtest_equity_curve (run_id, strategy_name, date, cash, position_value, total_equity, benchmark_2559_value, benchmark_1306_value, drawdown_pct, market_regime) VALUES (?,?,?,?,?,?,?,?,?,?)",
                          (
                              self.run_id,
                              strategy_name,
                              day,
                              self.cash,
                              pos_value,
                              total_equity,
                              bm_2559,
                              bm_1306,
                              drawdown,
                              market_regime,
                          ),
          ''',
          )

          replace_once(
              "src/models.py",
              '''    benchmark_1306_value REAL,
                  drawdown_pct REAL,
                  UNIQUE(run_id, strategy_name, date)
          ''',
              '''    benchmark_1306_value REAL,
                  drawdown_pct REAL,
                  market_regime TEXT,
                  UNIQUE(run_id, strategy_name, date)
          ''',
          )

          replace_once(
              "src/data_store.py",
              '''        add_missing("signals", {
                      "strategy_name": "TEXT NOT NULL DEFAULT 'momentum'",
                  })
          ''',
              '''        add_missing("signals", {
                      "strategy_name": "TEXT NOT NULL DEFAULT 'momentum'",
                  })
                  add_missing("backtest_equity_curve", {
                      "market_regime": "TEXT",
                  })
          ''',
          )

          Path("tests/test_regime_detector.py").write_text(
              '''"""
          相場レジーム検出器の回帰テスト。

          ファイルパス: tests/test_regime_detector.py
          何をするか: bull/bear/range判定、1日遅延、設定による有効化を検証する
          なぜ存在するか: 先読みや後方互換性の回帰を防ぐため
          関連ファイル: src/regime_detector.py, src/backtest_runner.py
          """

          from pathlib import Path

          import pandas as pd
          import yaml

          from src.config import Config
          from src.regime_detector import RegimeDetector


          def _config(tmp_path: Path, regime: dict | None = None) -> Config:
              config_path = tmp_path / "config.yaml"
              config_path.write_text(
                  yaml.safe_dump(
                      {
                          "backtest": {
                              "idle_cash_allocation": {
                                  "regime": regime or {},
                              }
                          }
                      },
                      allow_unicode=True,
                      sort_keys=False,
                  ),
                  encoding="utf-8",
              )
              return Config(str(config_path))


          def _prices() -> pd.DataFrame:
              return pd.DataFrame(
                  {
                      "date": pd.date_range("2026-01-01", periods=6, freq="D"),
                      "close": [10.0, 11.0, 12.0, 8.0, 10.0, 13.0],
                  }
              )


          def test_detects_unknown_bull_bear_and_range(tmp_path: Path) -> None:
              detector = RegimeDetector(
                  _config(
                      tmp_path,
                      {
                          "enabled": True,
                          "short_window": 2,
                          "long_window": 3,
                      },
                  )
              )

              regimes = detector.detect(_prices())

              assert [item["regime"] for item in regimes] == [
                  "unknown",
                  "unknown",
                  "bull",
                  "bear",
                  "range",
                  "bull",
              ]
              assert regimes[2]["sma50"] == 11.5
              assert regimes[2]["sma200"] == 11.0


          def test_regime_on_uses_previous_day_to_prevent_lookahead(
              tmp_path: Path,
          ) -> None:
              detector = RegimeDetector(
                  _config(
                      tmp_path,
                      {
                          "enabled": True,
                          "short_window": 2,
                          "long_window": 3,
                      },
                  )
              )
              regimes = detector.detect(_prices())

              assert detector.regime_on("2026-01-01", regimes) is None
              assert detector.regime_on("2026-01-04", regimes) == "bull"
              assert detector.regime_on("2026-01-05", regimes) == "bear"
              assert detector.regime_on("2026-01-07", regimes) is None


          def test_overlay_activation_respects_enabled_and_active_regimes(
              tmp_path: Path,
          ) -> None:
              disabled = RegimeDetector(_config(tmp_path))
              assert disabled.is_overlay_active("bull") is False

              enabled = RegimeDetector(
                  _config(
                      tmp_path,
                      {
                          "enabled": True,
                          "active_regimes": ["bull", "range"],
                      },
                  )
              )
              assert enabled.is_overlay_active("bull") is True
              assert enabled.is_overlay_active("range") is True
              assert enabled.is_overlay_active("bear") is False
              assert enabled.is_overlay_active(None) is False


          def test_detect_rejects_missing_required_columns(tmp_path: Path) -> None:
              detector = RegimeDetector(_config(tmp_path))

              try:
                  detector.detect(pd.DataFrame({"date": ["2026-01-01"]}))
              except ValueError as exc:
                  assert "close" in str(exc)
              else:
                  raise AssertionError("close列欠落はValueErrorになる必要があります")
          ''',
              encoding="utf-8",
          )
          PY

      - name: Format changed Python files
        run: |
          ruff format \
            src/regime_detector.py \
            src/backtest_runner.py \
            src/models.py \
            src/data_store.py \
            tests/test_regime_detector.py

      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -q

      - name: Run ruff
        run: ruff check --output-format=github src/ tests/ run_daily_cycle.py

      - name: Run pyright
        run: pyright

      - name: Compile source
        run: python -m compileall -q src

      - name: Amend implementation commit
        run: |
          rm .github/workflows/apply-regime-overlay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml config.example.yaml src/backtest_runner.py src/data_store.py src/models.py src/regime_detector.py tests/test_regime_detector.py
          git add -u .github/workflows/apply-regime-overlay.yml
          git commit --amend -m "feat: add regime-aware idle cash overlay"
          git push --force-with-lease origin HEAD:agent/regime-etf-overlay
