name: apply regime overlay implementation

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-regime-overlay.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"patch marker not found: {path}: {old[:80]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")


          replace_once(
              "config.yaml",
              '''  idle_cash_allocation:
              enabled: true         # 未投資資金をベンチマークETFに自動配分
              benchmark_code: "JP.1306"   # 配分先ベンチマーク
          ''',
              '''  idle_cash_allocation:
              enabled: true         # 未投資資金をベンチマークETFに自動配分
              benchmark_code: "JP.1306"   # 配分先ベンチマーク
              regime:
                enabled: false      # falseなら従来どおり常時ETFリターンを適用
                short_window: 50
                long_window: 200
                range_threshold_pct: 1.0
                active_regimes: ["bull"]
          ''',
          )

          replace_once(
              "config.example.yaml",
              '''  idle_cash_allocation:
              enabled: true
              benchmark_code: "JP.1306"
          ''',
              '''  idle_cash_allocation:
              enabled: true
              benchmark_code: "JP.1306"
              # SMA短期/長期で相場レジームを判定し、指定レジームだけETFへ配分する
              # enabled=false は後方互換モード（従来どおり常時配分）
              regime:
                enabled: false
                short_window: 50
                long_window: 200
                range_threshold_pct: 1.0
                active_regimes: ["bull"]
          ''',
          )

          Path("src/regime_detector.py").write_text(
              '''"""
          相場レジーム検出器

          ファイルパス: src/regime_detector.py
          何をするか: ベンチマークの短期/長期SMAからbull/bear/rangeを判定する
          なぜ存在するか: idle cash ETFオーバーレイを相場環境に応じて制御するため
          関連ファイル: backtest_runner.py, config.yaml, config.example.yaml
          """

          from typing import Optional

          import pandas as pd

          from .config import Config


          class RegimeDetector:
              """短期・長期SMAで相場レジームを判定する。"""

              VALID_REGIMES = frozenset({"bull", "bear", "range"})

              def __init__(self, config: Config):
                  regime_cfg = config.get("backtest.idle_cash_allocation.regime", {})
                  if not isinstance(regime_cfg, dict):
                      regime_cfg = {}

                  self.enabled = bool(regime_cfg.get("enabled", False))
                  self.short_window = int(regime_cfg.get("short_window", 50))
                  self.long_window = int(regime_cfg.get("long_window", 200))
                  self.range_threshold_pct = float(
                      regime_cfg.get("range_threshold_pct", 1.0)
                  )

                  raw_active = regime_cfg.get("active_regimes", ["bull"])
                  if isinstance(raw_active, str):
                      raw_active = [raw_active]
                  if not isinstance(raw_active, list):
                      raise ValueError("active_regimes は文字列のリストで指定してください")

                  active_regimes = frozenset(str(item).lower() for item in raw_active)
                  unknown = active_regimes - self.VALID_REGIMES
                  if unknown:
                      raise ValueError(
                          "未対応のレジームが指定されています: "
                          + ", ".join(sorted(unknown))
                      )
                  if self.short_window <= 0 or self.long_window <= 0:
                      raise ValueError("SMA期間は正の整数で指定してください")
                  if self.short_window >= self.long_window:
                      raise ValueError("short_window は long_window より小さくしてください")
                  if self.range_threshold_pct < 0:
                      raise ValueError("range_threshold_pct は0以上で指定してください")

                  self.active_regimes = active_regimes

              def detect(self, df: pd.DataFrame) -> pd.Series:
                  """日付をindex、レジームを値とするSeriesを返す。"""
                  if df.empty:
                      return pd.Series(dtype="object", name="market_regime")
                  if "close" not in df.columns:
                      raise ValueError("レジーム判定にはcloseカラムが必要です")

                  if "time_key" in df.columns:
                      raw_dates = df["time_key"]
                  elif "date" in df.columns:
                      raw_dates = df["date"]
                  elif isinstance(df.index, pd.DatetimeIndex):
                      raw_dates = pd.Series(df.index, index=df.index)
                  else:
                      raise ValueError(
                          "レジーム判定にはtime_key/dateカラムまたはDatetimeIndexが必要です"
                      )

                  frame = pd.DataFrame(
                      {
                          "date": pd.to_datetime(raw_dates, errors="coerce"),
                          "close": pd.to_numeric(df["close"], errors="coerce"),
                      }
                  )
                  frame = (
                      frame.dropna(subset=["date", "close"])
                      .sort_values("date")
                      .drop_duplicates(subset=["date"], keep="last")
                      .set_index("date")
                  )
                  if frame.empty:
                      return pd.Series(dtype="object", name="market_regime")

                  short_sma = frame["close"].rolling(
                      self.short_window,
                      min_periods=self.short_window,
                  ).mean()
                  long_sma = frame["close"].rolling(
                      self.long_window,
                      min_periods=self.long_window,
                  ).mean()
                  margin = long_sma * (self.range_threshold_pct / 100.0)
                  valid = short_sma.notna() & long_sma.notna()

                  regimes = pd.Series(
                      pd.NA,
                      index=frame.index,
                      dtype="object",
                      name="market_regime",
                  )
                  regimes.loc[valid & (short_sma > long_sma + margin)] = "bull"
                  regimes.loc[valid & (short_sma < long_sma - margin)] = "bear"
                  regimes.loc[valid & regimes.isna()] = "range"
                  return regimes

              def regime_on(self, date: str, regimes: pd.Series) -> Optional[str]:
                  """指定日の直前取引日に確定したレジームを返す。"""
                  if regimes.empty:
                      return None

                  target = pd.Timestamp(date)
                  history = regimes.copy()
                  history.index = pd.to_datetime(history.index, errors="coerce")
                  history = history[~history.index.isna()]
                  history = history[history.index < target].dropna()
                  if history.empty:
                      return None

                  regime = str(history.iloc[-1]).lower()
                  return regime if regime in self.VALID_REGIMES else None

              def is_overlay_active(self, regime: Optional[str]) -> bool:
                  """設定無効時は従来動作、有効時は指定レジームのみ許可する。"""
                  if not self.enabled:
                      return True
                  return regime is not None and regime.lower() in self.active_regimes
          ''',
              encoding="utf-8",
          )

          replace_once(
              "src/backtest_runner.py",
              "from .ranking import sort_items_by_score\n",
              "from .ranking import sort_items_by_score\nfrom .regime_detector import RegimeDetector\n",
          )
          replace_once(
              "src/backtest_runner.py",
              '''        self.split_adjustments = SplitAdjustmentService(self.db_path)
              self.run_id: Optional[int] = None
          ''',
              '''        self.split_adjustments = SplitAdjustmentService(self.db_path)
              self.regime_detector = RegimeDetector(config)
              self.run_id: Optional[int] = None
          ''',
          )
          replace_once(
              "src/backtest_runner.py",
              '''        self.min_trade_price = universe_cfg.get("min_trade_price", 500)
              self.max_trade_price = universe_cfg.get("max_trade_price", 20000)

              def _benchmark_code(self) -> str:
          ''',
              '''        self.min_trade_price = universe_cfg.get("min_trade_price", 500)
              self.max_trade_price = universe_cfg.get("max_trade_price", 20000)
              self._ensure_equity_curve_market_regime_column()

              def _ensure_equity_curve_market_regime_column(self) -> None:
                  """既存DBのequity curveへmarket_regime列を追加する。"""
                  with self._conn() as conn:
                      table = conn.execute(
                          "SELECT 1 FROM sqlite_master "
                          "WHERE type='table' AND name='backtest_equity_curve'"
                      ).fetchone()
                      if table is None:
                          return
                      columns = {
                          row[1]
                          for row in conn.execute(
                              "PRAGMA table_info(backtest_equity_curve)"
                          ).fetchall()
                      }
                      if "market_regime" not in columns:
                          conn.execute(
                              "ALTER TABLE backtest_equity_curve "
                              "ADD COLUMN market_regime TEXT"
                          )

              def _benchmark_code(self) -> str:
          ''',
          )
          replace_once(
              "src/backtest_runner.py",
              '''        # Idle cash allocation tracking
              idle_code = self._idle_cash_benchmark_code()
              idle_bench_prev = None

              # Trailing stop tracking: code -> highest close seen
          ''',
              '''        # Idle cash allocation tracking
              idle_code = self._idle_cash_benchmark_code()
              idle_bench_prev = None
              market_regimes = pd.Series(dtype="object", name="market_regime")
              if idle_code and self.regime_detector.enabled:
                  regime_history_limit = max(
                      250,
                      len(days) + self.regime_detector.long_window + 1,
                  )
                  regime_bars = self._bars_up_to(
                      idle_code,
                      end_date,
                      limit=regime_history_limit,
                  )
                  market_regimes = self.regime_detector.detect(regime_bars)

              # Trailing stop tracking: code -> highest close seen
          ''',
          )
          replace_once(
              "src/backtest_runner.py",
              '''            if (i + 1) % 20 == 0:
                  logger.info("  [%d/%d] %s ...", i + 1, total_days, day)

              candidates = trade_candidates
          ''',
              '''            if (i + 1) % 20 == 0:
                  logger.info("  [%d/%d] %s ...", i + 1, total_days, day)

              market_regime = (
                  self.regime_detector.regime_on(day, market_regimes)
                  if self.regime_detector.enabled
                  else None
              )
              overlay_active = self.regime_detector.is_overlay_active(market_regime)

              candidates = trade_candidates
          ''',
          )
          replace_once(
              "src/backtest_runner.py",
              '''            if idle_code:
                  bm_today = self._benchmark_value(idle_code, day)
                  if bm_today is not None and idle_bench_prev is not None:
                      daily_bm_ret = (bm_today - idle_bench_prev) / idle_bench_prev
                      investable_idle_cash = max(0.0, self.cash - self.reserved_cash)
                      self.cash += investable_idle_cash * daily_bm_ret
                  idle_bench_prev = bm_today
          ''',
              '''            if idle_code:
                  bm_today = self._benchmark_value(idle_code, day)
                  if (
                      bm_today is not None
                      and idle_bench_prev is not None
                      and overlay_active
                  ):
                      daily_bm_ret = (bm_today - idle_bench_prev) / idle_bench_prev
                      investable_idle_cash = max(0.0, self.cash - self.reserved_cash)
                      self.cash += investable_idle_cash * daily_bm_ret
                  idle_bench_prev = bm_today
          ''',
          )
          replace_once(
              "src/backtest_runner.py",
              '''                    "INSERT OR REPLACE INTO backtest_equity_curve (run_id, strategy_name, date, cash, position_value, total_equity, benchmark_2559_value, benchmark_1306_value, drawdown_pct) VALUES (?,?,?,?,?,?,?,?,?)",
                      (self.run_id, strategy_name, day, self.cash, pos_value, total_equity, bm_2559, bm_1306, drawdown),
          ''',
              '''                    "INSERT OR REPLACE INTO backtest_equity_curve (run_id, strategy_name, date, cash, position_value, total_equity, benchmark_2559_value, benchmark_1306_value, drawdown_pct, market_regime) VALUES (?,?,?,?,?,?,?,?,?,?)",
                      (
                          self.run_id,
                          strategy_name,
                          day,
                          self.cash,
                          pos_value,
                          total_equity,
                          bm_2559,
                          bm_1306,
                          drawdown,
                          market_regime,
                      ),
          ''',
          )

          replace_once(
              "src/models.py",
              '''    benchmark_1306_value REAL,
              drawdown_pct REAL,
              UNIQUE(run_id, strategy_name, date)
          ''',
              '''    benchmark_1306_value REAL,
              drawdown_pct REAL,
              market_regime TEXT,
              UNIQUE(run_id, strategy_name, date)
          ''',
          )

          replace_once(
              "src/data_store.py",
              '''        add_missing("signals", {
                  "strategy_name": "TEXT NOT NULL DEFAULT 'momentum'",
              })

              def _migrate_signals_unique_key(self, conn: sqlite3.Connection) -> None:
          ''',
              '''        add_missing("signals", {
                  "strategy_name": "TEXT NOT NULL DEFAULT 'momentum'",
              })
              add_missing("backtest_equity_curve", {
                  "market_regime": "TEXT",
              })

              def _migrate_signals_unique_key(self, conn: sqlite3.Connection) -> None:
          ''',
          )

          Path("tests/test_regime_detector.py").write_text(
              '''"""相場レジーム検出器の回帰テスト。"""

          from pathlib import Path

          import pandas as pd
          import pytest
          import yaml

          from src.config import Config
          from src.regime_detector import RegimeDetector


          def _config(tmp_path: Path, regime: dict) -> Config:
              config_path = tmp_path / "config.yaml"
              config_path.write_text(
                  yaml.safe_dump(
                      {
                          "database": {"path": str(tmp_path / "test.db")},
                          "backtest": {
                              "idle_cash_allocation": {
                                  "enabled": True,
                                  "benchmark_code": "JP.1306",
                                  "regime": regime,
                              }
                          },
                      },
                      sort_keys=False,
                  ),
                  encoding="utf-8",
              )
              return Config(str(config_path))


          def test_detect_classifies_bull_bear_and_range(tmp_path: Path) -> None:
              detector = RegimeDetector(
                  _config(
                      tmp_path,
                      {
                          "enabled": True,
                          "short_window": 2,
                          "long_window": 3,
                          "range_threshold_pct": 0,
                          "active_regimes": ["bull"],
                      },
                  )
              )
              dates = pd.date_range("2026-01-01", periods=6, freq="D")
              bars = pd.DataFrame(
                  {
                      "time_key": dates[::-1],
                      "close": [8, 8, 12, 10, 10, 10],
                  }
              )

              regimes = detector.detect(bars)

              assert pd.isna(regimes.loc[pd.Timestamp("2026-01-02")])
              assert regimes.loc[pd.Timestamp("2026-01-03")] == "range"
              assert regimes.loc[pd.Timestamp("2026-01-04")] == "bull"
              assert regimes.loc[pd.Timestamp("2026-01-05")] == "range"
              assert regimes.loc[pd.Timestamp("2026-01-06")] == "bear"


          def test_regime_on_uses_previous_trading_day(tmp_path: Path) -> None:
              detector = RegimeDetector(
                  _config(
                      tmp_path,
                      {
                          "enabled": True,
                          "short_window": 2,
                          "long_window": 3,
                          "range_threshold_pct": 0,
                          "active_regimes": ["bull"],
                      },
                  )
              )
              regimes = pd.Series(
                  ["range", "bull", "bear"],
                  index=pd.to_datetime(["2026-01-03", "2026-01-04", "2026-01-06"]),
                  dtype="object",
              )

              assert detector.regime_on("2026-01-03", regimes) is None
              assert detector.regime_on("2026-01-04", regimes) == "range"
              assert detector.regime_on("2026-01-05", regimes) == "bull"
              assert detector.regime_on("2026-01-07", regimes) == "bear"


          def test_overlay_activation_and_disabled_compatibility(tmp_path: Path) -> None:
              enabled = RegimeDetector(
                  _config(
                      tmp_path,
                      {
                          "enabled": True,
                          "active_regimes": ["bull", "range"],
                      },
                  )
              )
              assert enabled.is_overlay_active("bull")
              assert enabled.is_overlay_active("range")
              assert not enabled.is_overlay_active("bear")
              assert not enabled.is_overlay_active(None)

              disabled = RegimeDetector(
                  _config(tmp_path, {"enabled": False})
              )
              assert disabled.is_overlay_active("bear")
              assert disabled.is_overlay_active(None)


          def test_invalid_window_configuration_is_rejected(tmp_path: Path) -> None:
              with pytest.raises(ValueError, match="short_window"):
                  RegimeDetector(
                      _config(
                          tmp_path,
                          {
                              "enabled": True,
                              "short_window": 200,
                              "long_window": 50,
                          },
                      )
                  )
          ''',
              encoding="utf-8",
          )

          Path(".github/workflows/apply-regime-overlay.yml").unlink()
          PY

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate implementation
        run: |
          python -m pytest tests/test_regime_detector.py -q
          python -m pytest tests/ -m "not slow" -q
          ruff check src/ tests/ run_daily_cycle.py
          pyright
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml config.example.yaml src/backtest_runner.py src/regime_detector.py src/models.py src/data_store.py tests/test_regime_detector.py .github/workflows/apply-regime-overlay.yml
          git commit -m "feat: add regime-aware idle cash overlay"
          git push origin HEAD:master
