name: apply-v2-execution-refactor

on:
  push:
    branches:
      - agent/v2-execution-reproducibility

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-execution-reproducibility
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply local corrections
        run: python scripts/apply_v2_corrections.py

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate corrected implementation
        run: |
          : > /tmp/v2_validation.log
          STATUS=0
          python -m pytest tests/ -m 'not slow' -q >> /tmp/v2_validation.log 2>&1 || STATUS=$?
          ruff check src/ tests/ run_daily_cycle.py >> /tmp/v2_validation.log 2>&1 || STATUS=$?
          pyright >> /tmp/v2_validation.log 2>&1 || STATUS=$?
          cat /tmp/v2_validation.log
          if [ "$STATUS" -ne 0 ]; then
            cp /tmp/v2_validation.log V2_REFACTOR_FAILURE.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src tests V2_REFACTOR_FAILURE.txt
            git commit -m 'chore: capture corrected v2 validation failure'
            git push origin HEAD:agent/v2-execution-reproducibility
            exit "$STATUS"
          fi

      - name: Remove temporary migration assets
        run: |
          rm scripts/.v2_refactor.part1.b64
          rm scripts/.v2_refactor.part2.b64
          rm scripts/.v2_refactor.part3.b64
          rm scripts/apply_v2_corrections.py
          rm .github/workflows/apply-v2-execution-refactor.yml
          rm -f V2_REFACTOR_FAILURE.txt V2_REFACTOR_TRIGGER.txt

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: share execution accounting and fingerprint backtests'
          git push origin HEAD:agent/v2-execution-reproducibility
