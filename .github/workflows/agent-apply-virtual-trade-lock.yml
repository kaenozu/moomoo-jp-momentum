name: Apply virtual order lock patch

on:
  push:
    branches:
      - agent/serialize-virtual-order-creation
    paths:
      - tools/agent_apply_virtual_trade_lock.py
      - .github/workflows/agent-apply-virtual-trade-lock.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/serialize-virtual-order-creation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Apply focused patch
        run: python tools/agent_apply_virtual_trade_lock.py

      - name: Verify changed code
        run: |
          python -m compileall -q src tests/test_virtual_order_concurrency.py
          python -m pytest -q tests/test_virtual_order_concurrency.py tests/test_virtual_integration.py
          git diff --check

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: serialize virtual order creation"
          git push origin HEAD:agent/serialize-virtual-order-creation
