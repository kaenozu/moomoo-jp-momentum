name: Format benchmark fix

on:
  push:
    branches:
      - agent/benchmark-corporate-action-fix
    paths:
      - .github/workflows/fix-benchmark-ruff.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/benchmark-corporate-action-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Fix changed files
        run: |
          ruff check --fix \
            src/benchmarking.py \
            src/backtest_runner.py \
            src/benchmark.py \
            src/backtest_evaluation.py \
            src/walk_forward_validation.py \
            validated_backtest.py \
            historical_backtest.py \
            scripts/rerun_p2_benchmarks.py \
            tests/test_benchmarking.py
          ruff format \
            src/benchmarking.py \
            src/backtest_runner.py \
            src/benchmark.py \
            src/backtest_evaluation.py \
            src/walk_forward_validation.py \
            validated_backtest.py \
            historical_backtest.py \
            scripts/rerun_p2_benchmarks.py \
            tests/test_benchmarking.py
          ruff check \
            src/benchmarking.py \
            src/backtest_runner.py \
            src/benchmark.py \
            src/backtest_evaluation.py \
            src/walk_forward_validation.py \
            validated_backtest.py \
            historical_backtest.py \
            scripts/rerun_p2_benchmarks.py \
            tests/test_benchmarking.py
          rm .github/workflows/fix-benchmark-ruff.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format benchmark fix"
          git push origin HEAD:agent/benchmark-corporate-action-fix
