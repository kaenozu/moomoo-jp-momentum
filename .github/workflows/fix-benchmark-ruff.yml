name: Capture benchmark Ruff diagnostics

on:
  push:
    branches:
      - agent/benchmark-corporate-action-fix
    paths:
      - .github/workflows/fix-benchmark-ruff.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/benchmark-corporate-action-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture Ruff output
        run: |
          python -m pip install ruff
          ruff check \
            src/benchmarking.py \
            src/backtest_runner.py \
            src/benchmark.py \
            src/backtest_evaluation.py \
            src/walk_forward_validation.py \
            validated_backtest.py \
            historical_backtest.py \
            scripts/rerun_p2_benchmarks.py \
            tests/test_benchmarking.py \
            > .ruff-benchmark.txt 2>&1 || true
          cat .ruff-benchmark.txt
          rm .github/workflows/fix-benchmark-ruff.yml
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture benchmark ruff diagnostics"
          git push origin HEAD:agent/benchmark-corporate-action-fix
