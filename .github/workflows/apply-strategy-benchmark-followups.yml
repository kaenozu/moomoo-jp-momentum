name: apply strategy benchmark follow-ups

on:
  push:
    branches:
      - fix/strategy-runner-benchmark-date
    paths:
      - strategy-benchmark-followups.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strategy-runner-benchmark-date
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply follow-up fixes
        run: |
          python scripts/apply_strategy_benchmark_followups.py
          rm -f scripts/apply_strategy_benchmark_followups.py
          rm -f strategy-benchmark-followups.trigger
          rm -f .github/workflows/apply-strategy-benchmark-followups.yml

      - name: Commit follow-up fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce exact benchmark periods"
          git push origin HEAD:fix/strategy-runner-benchmark-date
