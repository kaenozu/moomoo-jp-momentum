name: diagnose-pr22

on:
  pull_request:
    branches:
      - master

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run full fast tests
        run: |
          set +e
          python -m pytest tests/ -m "not slow" -vv > "$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pytest.log"
          exit $status
      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr22-full-pytest
          path: ${{ runner.temp }}/pytest.log
          retention-days: 1
