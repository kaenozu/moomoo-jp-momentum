name: apply-pr22-review-fixes

on:
  push:
    branches:
      - fix/daily-cycle-integrity-gate
    paths:
      - .github/scripts/apply_pr22_review_fixes.py
      - .github/workflows/apply-pr22-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-cycle-integrity-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply review fixes
        run: python .github/scripts/apply_pr22_review_fixes.py
      - name: Commit final patch
        run: |
          rm .github/scripts/apply_pr22_review_fixes.py
          rm .github/workflows/apply-pr22-review-fixes.yml
          rm .github/workflows/diagnose-pr22.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden daily-cycle integrity gate'
          git push origin HEAD:fix/daily-cycle-integrity-gate
