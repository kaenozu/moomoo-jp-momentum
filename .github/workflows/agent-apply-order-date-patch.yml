name: Apply order-date patch

on:
  push:
    branches:
      - fix/virtual-orders-as-of-date

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/virtual-orders-as-of-date
          fetch-depth: 0

      - name: Apply focused source and test changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/virtual_trade.py")
          source = source_path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''        pending_rows = conn.execute(
              """
              SELECT DISTINCT code
              FROM virtual_orders
              WHERE strategy_name = ?
                AND side = 'BUY'
                AND status = 'PENDING'
                AND (? IS NULL OR id <> ?)
              """,
              (strategy_name, exclude_order_id, exclude_order_id),
          ).fetchall()
          ''',
                  '''        pending_rows = conn.execute(
              """
              SELECT DISTINCT code
              FROM virtual_orders
              WHERE strategy_name = ?
                AND side = 'BUY'
                AND status = 'PENDING'
                AND (? IS NULL OR substr(submitted_at, 1, 10) <= ?)
                AND (? IS NULL OR id <> ?)
              """,
              (
                  strategy_name,
                  reference_date,
                  reference_date,
                  exclude_order_id,
                  exclude_order_id,
              ),
          ).fetchall()
          ''',
              ),
              (
                  '''    def _validate_sell_order(
          self,
          conn: sqlite3.Connection,
          strategy_name: str,
          code: str,
          quantity: int,
          exclude_order_id: int | None = None,
      ) -> tuple[bool, str]:
          position = conn.execute(
              """
              SELECT quantity FROM virtual_positions
              WHERE strategy_name = ? AND code = ?
              """,
              (strategy_name, code),
          ).fetchone()
          if not position or int(position["quantity"]) < quantity:
              return False, "売却可能な仮想ポジションが不足しています"

          pending = conn.execute(
              """
              SELECT 1 FROM virtual_orders
              WHERE strategy_name = ?
                AND code = ?
                AND side = 'SELL'
                AND status = 'PENDING'
                AND (? IS NULL OR id <> ?)
              LIMIT 1
              """,
              (strategy_name, code, exclude_order_id, exclude_order_id),
          ).fetchone()
          if pending:
              return False, "同一銘柄の未約定SELL注文が既に存在します"
          return True, ""
          ''',
                  '''    def _validate_sell_order(
          self,
          conn: sqlite3.Connection,
          strategy_name: str,
          code: str,
          quantity: int,
          reference_date: str | None = None,
          exclude_order_id: int | None = None,
      ) -> tuple[bool, str]:
          position = conn.execute(
              """
              SELECT quantity FROM virtual_positions
              WHERE strategy_name = ? AND code = ?
              """,
              (strategy_name, code),
          ).fetchone()
          if not position or int(position["quantity"]) < quantity:
              return False, "売却可能な仮想ポジションが不足しています"

          pending = conn.execute(
              """
              SELECT 1 FROM virtual_orders
              WHERE strategy_name = ?
                AND code = ?
                AND side = 'SELL'
                AND status = 'PENDING'
                AND (? IS NULL OR substr(submitted_at, 1, 10) <= ?)
                AND (? IS NULL OR id <> ?)
              LIMIT 1
              """,
              (
                  strategy_name,
                  code,
                  reference_date,
                  reference_date,
                  exclude_order_id,
                  exclude_order_id,
              ),
          ).fetchone()
          if pending:
              return False, "同一銘柄の未約定SELL注文が既に存在します"
          return True, ""
          ''',
              ),
              (
                  '''                ok, reason = self._validate_sell_order(
                      conn,
                      strategy_name,
                      code,
                      quantity,
                  )
          ''',
                  '''                ok, reason = self._validate_sell_order(
                      conn,
                      strategy_name,
                      code,
                      quantity,
                      reference_date=reference_date,
                  )
          ''',
              ),
              (
                  '''                ok, reason = self._validate_sell_order(
                      conn,
                      order.strategy_name,
                      order.code,
                      order.quantity,
                      exclude_order_id=order.id,
                  )
          ''',
                  '''                ok, reason = self._validate_sell_order(
                      conn,
                      order.strategy_name,
                      order.code,
                      order.quantity,
                      reference_date=target_date,
                      exclude_order_id=order.id,
                  )
          ''',
              ),
              (
                  '''                    SELECT 1 FROM virtual_orders
                      WHERE strategy_name = ? AND code = ? AND side = 'SELL' AND status = 'PENDING'
                      LIMIT 1
                      """,
                      (strategy_name, pos.code),
          ''',
                  '''                    SELECT 1 FROM virtual_orders
                      WHERE strategy_name = ? AND code = ? AND side = 'SELL' AND status = 'PENDING'
                        AND substr(submitted_at, 1, 10) <= ?
                      LIMIT 1
                      """,
                      (strategy_name, pos.code, target_date),
          ''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one source match, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_virtual_trade_order_dates.py")
          test_path.write_text(
              '''"""Regression coverage for as-of-date virtual-order validation."""

          import sqlite3
          from pathlib import Path

          from src.config import Config
          from src.data_store import DataStore
          from src.virtual_trade import VirtualTradeManager


          def _make_manager(
              tmp_path: Path,
              *,
              max_total_positions: int = 5,
              position_quantity: int = 0,
          ) -> tuple[VirtualTradeManager, Path]:
              db_path = tmp_path / "virtual_order_dates.db"
              config = Config("tests/fixtures/config.test.yaml")
              config._config["database"] = {"path": str(db_path)}
              virtual_config = dict(config.get("virtual_trade", {}))
              virtual_config.update(
                  {
                      "initial_cash": 100000,
                      "max_position_amount": 50000,
                      "max_total_positions": max_total_positions,
                      "max_position_per_symbol": 10,
                      "commission": 0,
                      "reserve_buffer_pct": 2.0,
                      "market_fill_mode": "next_day_open",
                  }
              )
              config._config["virtual_trade"] = virtual_config
              config._config["universe"] = {
                  "min_trade_price": 1,
                  "max_trade_price": 50000,
              }
              DataStore(config)

              with sqlite3.connect(db_path) as conn:
                  for code in ("JP.0001", "JP.0002"):
                      conn.execute(
                          """
                          INSERT INTO symbols
                          (code, name, type, role, tradable, enabled)
                          VALUES (?, ?, 'stock', 'trade_candidate', 1, 1)
                          """,
                          (code, code),
                      )
                  conn.executemany(
                      """
                      INSERT INTO daily_bars
                      (code, date, open, high, low, close, volume, turnover)
                      VALUES (?, ?, ?, ?, ?, ?, 10000, 10000000)
                      """,
                      [
                          ("JP.0001", "2026-01-05", 1000, 1010, 990, 1000),
                          ("JP.0001", "2026-01-06", 1010, 1020, 1000, 1010),
                          ("JP.0002", "2026-01-05", 1000, 1010, 990, 1000),
                      ],
                  )
                  conn.execute(
                      """
                      INSERT INTO virtual_equity_curve
                      (strategy_name, date, cash, position_value, total_equity, created_at)
                      VALUES ('default', '2026-01-04', 100000, 0, 100000,
                              '2026-01-04T00:00:00')
                      """
                  )
                  if position_quantity:
                      conn.execute(
                          """
                          INSERT INTO virtual_positions
                          (strategy_name, code, quantity, avg_cost, market_price,
                           market_value, unrealized_pl, realized_pl, updated_at)
                          VALUES ('default', 'JP.0001', ?, 1000, 1000, ?, 0, 0,
                                  '2026-01-05T00:00:00')
                          """,
                          (position_quantity, position_quantity * 1000),
                      )

              return VirtualTradeManager(config), db_path


          def _insert_pending(
              db_path: Path,
              *,
              code: str,
              side: str,
              submitted_at: str,
          ) -> None:
              with sqlite3.connect(db_path) as conn:
                  conn.execute(
                      """
                      INSERT INTO virtual_orders
                      (strategy_name, code, side, quantity, order_type, status,
                       submitted_at, reserved_amount, created_at, updated_at)
                      VALUES ('default', ?, ?, 1, 'MARKET_SIM', 'PENDING', ?,
                              NULL, ?, ?)
                      """,
                      (code, side, submitted_at, submitted_at, submitted_at),
                  )


          def test_future_pending_buy_does_not_block_historical_same_symbol(tmp_path: Path) -> None:
              manager, db_path = _make_manager(tmp_path)
              _insert_pending(
                  db_path,
                  code="JP.0001",
                  side="BUY",
                  submitted_at="2026-01-10 15:30:00",
              )

              order = manager.place_order(
                  "default",
                  "JP.0001",
                  "BUY",
                  1,
                  submitted_at="2026-01-05",
              )

              assert order is not None


          def test_future_pending_buy_does_not_consume_historical_position_slot(
              tmp_path: Path,
          ) -> None:
              manager, db_path = _make_manager(tmp_path, max_total_positions=1)
              _insert_pending(
                  db_path,
                  code="JP.0002",
                  side="BUY",
                  submitted_at="2026-01-10 15:30:00",
              )

              order = manager.place_order(
                  "default",
                  "JP.0001",
                  "BUY",
                  1,
                  submitted_at="2026-01-05",
              )

              assert order is not None


          def test_same_day_pending_buy_still_blocks_duplicate(tmp_path: Path) -> None:
              manager, _ = _make_manager(tmp_path)
              first = manager.place_order(
                  "default",
                  "JP.0001",
                  "BUY",
                  1,
                  submitted_at="2026-01-05",
              )
              second = manager.place_order(
                  "default",
                  "JP.0001",
                  "BUY",
                  1,
                  submitted_at="2026-01-05",
              )

              assert first is not None
              assert second is None


          def test_future_pending_sell_does_not_block_historical_order(tmp_path: Path) -> None:
              manager, db_path = _make_manager(tmp_path, position_quantity=2)
              _insert_pending(
                  db_path,
                  code="JP.0001",
                  side="SELL",
                  submitted_at="2026-01-10 15:30:00",
              )

              order = manager.place_order(
                  "default",
                  "JP.0001",
                  "SELL",
                  1,
                  submitted_at="2026-01-05",
              )

              assert order is not None


          def test_same_day_pending_sell_still_blocks_duplicate(tmp_path: Path) -> None:
              manager, _ = _make_manager(tmp_path, position_quantity=2)
              first = manager.place_order(
                  "default",
                  "JP.0001",
                  "SELL",
                  1,
                  submitted_at="2026-01-05",
              )
              second = manager.place_order(
                  "default",
                  "JP.0001",
                  "SELL",
                  1,
                  submitted_at="2026-01-05",
              )

              assert first is not None
              assert second is None


          def test_future_pending_sell_does_not_block_historical_fill(tmp_path: Path) -> None:
              manager, db_path = _make_manager(tmp_path, position_quantity=2)
              order = manager.place_order(
                  "default",
                  "JP.0001",
                  "SELL",
                  1,
                  submitted_at="2026-01-05",
              )
              assert order is not None
              _insert_pending(
                  db_path,
                  code="JP.0001",
                  side="SELL",
                  submitted_at="2026-01-10 15:30:00",
              )

              fills = manager.process_fills("default", "2026-01-06")

              assert len(fills) == 1
              assert fills[0].order_id == order.id
          ''',
              encoding="utf-8",
          )

          pyright_path = Path("pyrightconfig.json")
          pyright = pyright_path.read_text(encoding="utf-8")
          marker = '    "tests/test_virtual_trade_reservations.py"\n'
          replacement = (
              '    "tests/test_virtual_trade_order_dates.py",\n'
              '    "tests/test_virtual_trade_reservations.py"\n'
          )
          if marker not in pyright:
              raise RuntimeError("pyright insertion marker not found")
          pyright_path.write_text(pyright.replace(marker, replacement, 1), encoding="utf-8")

          for temporary in (
              Path(".agent-tree-probe"),
              Path(".github/workflows/agent-apply-order-date-patch.yml"),
          ):
              if temporary.exists():
                  temporary.unlink()
          PY

      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate virtual order validation by date"
          git push origin HEAD:fix/virtual-orders-as-of-date
