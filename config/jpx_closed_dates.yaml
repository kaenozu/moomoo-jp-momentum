# JPX cash-market closure dates used by src/market_calendar.py.
#
# Sources:
# - Japan Exchange Group market holidays (2026/2027), updated 2026-02-06:
#   https://www.jpx.co.jp/english/corporate/about-jpx/calendar/index.html
# - Cabinet Office national-holiday calendar through 2027:
#   https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html
#
# Saturdays and Sundays are rejected by code even when omitted here. They are
# retained below when JPX explicitly lists them, so this file mirrors the
# published calendar. 2024 is retained to resolve the previous session for the
# repository's 2025 data-start boundary. Update this file before processing an
# unsupported year.

