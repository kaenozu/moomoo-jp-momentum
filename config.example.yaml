# Moomoo日本株モメンタム検証ツール 設定ファイル
# config.yaml としてコピーして使用してください

# OpenD接続設定
opend:
  host: "127.0.0.1"
  port: 11111
  timeout: 10

# マーケットデータ設定
market_data:
  require_paid_quote_card: false
  use_order_book: false
  use_tick: false
  use_realtime_push: false

# 相場データ設定
quote:
  market: "JP"
  data_types:
    - "SNAPSHOT"
    - "K_DAY"

# 取引時間設定（東証現物市場）
# MVPの制限: 祝日・休場日・臨時休場には完全対応しません。平日のみの簡易判定です。
trading_hours:
  enabled: true
  morning:
    open: "09:00"
    close: "11:30"
  afternoon:
    open: "12:30"
    close: "15:30"
  skip_weekends: true

# 銘柄リスト設定
watchlist:
  symbols_file: "data/symbols.json"
  max_symbols: 50

# シグナル判定設定
signals:
  ma_periods:
    short: 5
    medium: 25
  volume_ratio_threshold: 1.5
  turnover_threshold_yen: 10.0
  relative_strength:
    benchmark_code: "JP.1306"
    period_days: 20

# スクリーニング設定
screening:
  min_turnover: 1000000000
  min_volume_ratio: 1.2
  max_distance_from_high_20d: 5.0
  risk_daily_return_threshold: 8.0
  risk_return_5d_threshold: 15.0
  risk_volume_ratio_threshold: 5.0
  min_history_days: 25
  downgrade_extreme_volume_ratio: true

# スコアリング設定
scoring:
  enable_risk_penalty: true
  score_threshold_candidate: 70
  score_threshold_watch: 50
  weights:
    trend: 30
    volume: 20
    relative_strength: 25
    liquidity: 15
    high_20d: 10
    risk_warning: -30

# ベンチマーク設定
benchmark:
  primary:
    code: "JP.2559"
    name: "MAXIS全世界株式（オール・カントリー）"
  secondary:
    - code: "JP.1306"
      name: "TOPIX連動ETF"
    - code: "JP.1320"
      name: "日経平均連動ETF"
    - code: "JP.2558"
      name: "MAXIS米国株式（S&P500）"

# データベース設定
database:
  path: "data/moomoo.db"

# 出力設定
output:
  csv: true
  html: true
  sqlite: true

report:
  output_dir: "reports"

# アプリ設定
app:
  title: "Moomoo Strategy Monitor"
  timezone: "Asia/Tokyo"
  default_benchmark: "JP.2559"

# アラート設定
alerts:
  enabled: false
  console: true
  file: true
  webhook:
    enabled: false
    url: ""
  score_threshold: 90
  notify_new_candidates: true
  notify_sell_watch: true
  notify_stale_data: true

# スケジューラ設定
scheduler:
  enabled: false
  timezone: "Asia/Tokyo"
  jobs:
    connection_check:
      enabled: true
      cron: "45 8 * * 1-5"
    daily_update:
      enabled: true
      cron: "45 15 * * 1-5"
    screen_candidates:
      enabled: true
      cron: "50 15 * * 1-5"
    performance_report:
      enabled: true
      cron: "0 16 * * 1-5"
    send_alerts:
      enabled: true
      cron: "5 16 * * 1-5"
    weekly_report:
      enabled: true
      cron: "30 16 * * 5"

# ペーパートレード設定
# moomoo JP / FUTUJP では、OpenAPI経由の日本株SIMULATE注文が利用できないため、
# JP市場では使用しません。US市場向け experimental のみ残します。
paper_trade:
  enabled: false
  jp_api_simulate_supported: false
  allow_market_order: false
  max_order_quantity: 10
  max_order_amount: 50000
  note: "moomoo JP/FUTUJPでは日本株のAPI SIMULATE注文が利用できない可能性が高いため、本プロジェクトでは使用しません。"
