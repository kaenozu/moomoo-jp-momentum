# Moomoo日本株モメンタム検証ツール 設定例
# config.yamlとしてコピーして使用してください。ベンチマークはTOPIX (JP.1306) です。
opend:
  host: 127.0.0.1
  port: 11111
  timeout: 10
market_data:
  require_paid_quote_card: false
  use_order_book: false
  use_tick: false
  use_realtime_push: false
quote:
  market: JP
  data_types:
  - SNAPSHOT
  - K_DAY
trading_hours:
  enabled: true
  morning:
    open: 09:00
    close: '11:30'
  afternoon:
    open: '12:30'
    close: '15:30'
  skip_weekends: true
watchlist:
  symbols_file: data/symbols.json
  max_symbols: 1000
universe:
  min_trade_price: 500
  max_trade_price: 20000
  allow_expensive_watch_only: true
  exclude_low_price_stocks: true
  auto_downgrade_expensive_to_watch: true
signals:
  ma_periods:
    short: 5
    medium: 25
  relative_strength:
    benchmark_code: JP.1306
    period_days: 20
  volume:
    hard_gate: false
    min_ratio: 1.5
    use_percentile: true
    percentile_threshold: 60
    market_low_volume_threshold: 0.8
screening:
  min_turnover: 100000000
  min_volume_ratio: 1.2
  max_distance_from_high_20d: 5.0
  risk_daily_return_threshold: 8.0
  risk_return_5d_threshold: 15.0
  risk_volume_ratio_threshold: 5.0
  min_history_days: 25
  downgrade_extreme_volume_ratio: true
  max_return_5d: 10.0
scoring:
  enable_risk_penalty: true
  score_threshold_candidate: 70
  score_threshold_watch: 50
  weights:
    trend: 30
    volume: 20
    relative_strength: 25
    liquidity: 15
    high_20d: 10
    risk_warning: -30
benchmark:
  primary:
    code: JP.1306
    name: TOPIX連動型ETF
  secondary:
  - code: JP.1320
    name: 日経平均連動ETF
  - code: JP.2559
    name: MAXIS全世界株式（オール・カントリー）
  - code: JP.2558
    name: MAXIS米国株式（S&P500）
database:
  path: data/moomoo.db
database_backup:
  enabled: false
  directory: backups
  retain_daily: 7
  retain_weekly: 4
  verify_after_backup: true
output:
  csv: true
  html: true
  sqlite: true
report:
  output_dir: reports
app:
  title: Moomoo JP Strategy Monitor
  timezone: Asia/Tokyo
  default_benchmark: JP.1306
alerts:
  enabled: false
  console: true
  file: true
  webhook:
    enabled: false
    url: ''
  operational:
    enabled: false
    timeout_seconds: 10
  score_threshold: 90
  notify_new_candidates: true
  notify_sell_watch: true
  notify_stale_data: true
scheduler:
  enabled: false
  timezone: Asia/Tokyo
  jobs:
    connection_check:
      enabled: true
      cron: 55 15 * * 1-5
    daily_cycle:
      enabled: true
      cron: 5 16 * * 1-5
backtest:
  stop_loss_pct: 8.0
  max_positions: 5
  idle_cash_allocation:
    enabled: false
    benchmark_code: JP.1306
virtual_trade:
  enabled: true
  initial_cash: 150000
  max_position_amount: 20000
  max_total_positions: 5
  max_position_per_symbol: 1
  market_fill_mode: next_day_open
  score_threshold_for_order: 70
  allow_fractional: false
  commission: 0
  slippage_bps: 10
  reserve_buffer_pct: 2.0
  tax_enabled: false
  default_benchmark: JP.1306
  integrity_check:
    enabled: true
    fail_on_warning: false
paper_trade:
  enabled: false
  jp_api_simulate_supported: false
  allow_market_order: false
  max_order_quantity: 10
  max_order_amount: 50000
  note: 日本株の実注文APIは使用せず、SQLite仮想売買のみを利用する
