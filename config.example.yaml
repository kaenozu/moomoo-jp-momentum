# ファイルパス: config.example.yaml
# 何をするか: Moomoo日本株モメンタム検証ツールの設定例を定義する
# なぜ存在するか: config.yamlを安全かつ再現可能に作成できるようにするため
# 関連ファイル: src/config.py, src/strategies/momentum.py, src/filters/quality_risk_filter.py
# config.yaml としてコピーして使用してください

opend:
  host: "127.0.0.1"
  port: 11111
  timeout: 10

market_data:
  require_paid_quote_card: false
  use_order_book: false
  use_tick: false
  use_realtime_push: false

quote:
  market: "JP"
  data_types:
    - "SNAPSHOT"
    - "K_DAY"

daily_cycle:
  markets:
    - JP
  fetch_mode: latest
  latest_bar_count: 120

trading_hours:
  enabled: true
  morning:
    open: "09:00"
    close: "11:30"
  afternoon:
    open: "12:30"
    close: "15:30"
  skip_weekends: true

watchlist:
  symbols_file: "data/symbols.json"
  max_symbols: 50

# 銘柄ユニバース設定
# role=trade_candidate かつ tradable=true かつ価格レンジ内のみ買い候補/仮想注文対象
universe:
  min_trade_price: 500
  max_trade_price: 20000
  allow_expensive_watch_only: true
  exclude_low_price_stocks: true
  auto_downgrade_expensive_to_watch: true

signals:
  ma_periods:
    short: 5
    medium: 25
  volume_ratio_threshold: 1.5
  turnover_threshold_yen: 10.0
  relative_strength:
    benchmark_code: "JP.1306"
    period_days: 5
  # momentum候補の過熱をquality_low_risk相当の条件で除外する任意フィルター
  quality_filter:
    enabled: false
    max_daily_return: 5.0
    max_return_5d: 10.0
    max_volume_ratio: 3.0

screening:
  min_turnover: 1000000000
  min_volume_ratio: 1.2
  max_distance_from_high_20d: 5.0
  risk_daily_return_threshold: 8.0
  risk_return_5d_threshold: 15.0
  risk_volume_ratio_threshold: 5.0
  min_history_days: 25
  downgrade_extreme_volume_ratio: true

scoring:
  enable_risk_penalty: true
  score_threshold_candidate: 70
  score_threshold_watch: 50
  weights:
    trend: 30
    volume: 20
    relative_strength: 25
    liquidity: 15
    high_20d: 10
    risk_warning: -30

benchmark:
  primary:
    code: "JP.1306"
    name: "TOPIX連動ETF"
  secondary:
    - code: "JP.2559"
      name: "MAXIS全世界株式（オール・カントリー）"
    - code: "JP.1320"
      name: "日経平均連動ETF"
    - code: "JP.2558"
      name: "MAXIS米国株式（S&P500）"

database:
  path: "data/moomoo.db"

output:
  csv: true
  html: true
  sqlite: true

report:
  output_dir: "reports"

app:
  title: "Moomoo Strategy Monitor"
  timezone: "Asia/Tokyo"
  default_benchmark: "JP.1306"

alerts:
  enabled: false
  console: true
  file: true
  webhook:
    enabled: false
    url: ""
  score_threshold: 90
  notify_new_candidates: true
  notify_sell_watch: true
  notify_stale_data: true

scheduler:
  enabled: false
  timezone: "Asia/Tokyo"
  jobs:
    connection_check:
      enabled: true
      cron: "45 8 * * 1-5"
    daily_update:
      enabled: true
      cron: "45 15 * * 1-5"
    screen_candidates:
      enabled: true
      cron: "50 15 * * 1-5"
    performance_report:
      enabled: true
      cron: "0 16 * * 1-5"
    send_alerts:
      enabled: true
      cron: "5 16 * * 1-5"
    weekly_report:
      enabled: true
      cron: "30 16 * * 5"

# 履歴バックテスト設定
backtest:
  max_positions: 5
  stop_loss_pct: 5.0
  idle_cash_allocation:
    enabled: true
    benchmark_code: "JP.1306"

# アプリ内仮想ペーパートレード設定
# moomoo APIには注文を送信しない。SQLite上の仮想売買のみ。
virtual_trade:
  enabled: true
  initial_cash: 100000
  max_position_amount: 20000
  max_total_positions: 5
  max_position_per_symbol: 1
  market_fill_mode: "next_day_open"
  score_threshold_for_order: 70
  allow_fractional: false
  commission: 0
  slippage_bps: 10
  tax_enabled: false
  default_benchmark: "JP.1306"

# moomoo OpenAPIのSIMULATE取引はJP市場では使わない
paper_trade:
  enabled: false
  jp_api_simulate_supported: false
  allow_market_order: false
  max_order_quantity: 10
  max_order_amount: 50000
  note: "moomoo JP/FUTUJPでは日本株のAPI SIMULATE注文が利用できない可能性が高いため、本プロジェクトでは使用しません。"

strategies:
  etf_rotation:
    codes: ["JP.2559", "JP.1306", "JP.1320", "JP.2558", "JP.2563"]
